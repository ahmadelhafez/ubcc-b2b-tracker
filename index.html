<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBCC / Legenda · B2B Account Engine</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--teal:#008EA6;--deep:#056A78;--paper:#F7F4EF;--char:#3A3A3A;--grey:#8a8578;--card:#fff;--rust:#B05C3B;--gold:#A8894C;--line:#e6e0d2;--ok:#2e7d32;--bad:#c62828;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--char);font-size:14px}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
button{cursor:pointer;font-family:inherit}
a{color:var(--deep)}
.hidden{display:none!important}
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
#login h1{color:var(--deep);font-size:22px;margin-bottom:4px}
#login p{color:var(--grey);font-size:12px;margin-bottom:18px}
#login input{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
#login button{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold}
#loginerr{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px}
header{background:var(--deep);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:18px;letter-spacing:.4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px}
nav button.on{background:var(--teal);border-color:var(--teal);font-weight:bold}
#who{margin-left:auto;font-size:11px;opacity:.8}
#season{background:var(--gold);color:#fff;padding:6px 20px;font-size:12px;text-align:center}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input,.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.controls input{min-width:200px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:bold}
.btn.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.kpi .l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:24px;font-weight:bold;color:var(--deep);font-family:Georgia,serif}
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{min-width:255px;max-width:255px;background:#efeade;border-radius:12px;padding:8px;flex-shrink:0}
.col h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--deep);padding:6px;display:flex;justify-content:space-between;font-family:Arial}
.col .n{background:var(--teal);color:#fff;border-radius:10px;padding:0 8px;font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:7px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.card:hover{border-color:var(--teal)}
.card .t{font-size:13px;font-weight:bold}
.card .m{font-size:11px;color:var(--grey);margin-top:3px}
.badge{display:inline-block;font-size:10px;border-radius:7px;padding:1px 7px;margin-top:5px;background:#eef6f7;color:var(--deep);border:1px solid #cfe6ea;margin-right:3px}
.score{float:right;font-size:11px;font-weight:bold;color:#fff;background:var(--teal);border-radius:7px;padding:1px 7px}
.score.hi{background:var(--rust)}
.flag{font-size:10px;color:var(--rust);font-weight:bold}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}
#dossier{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--paper);z-index:100;overflow-y:auto;box-shadow:-6px 0 30px rgba(0,0,0,.2);padding:22px}
#dossier h2{color:var(--deep);font-size:20px;margin-bottom:2px}
.sect{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.sect h3{font-size:13px;color:var(--deep);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{font-size:10px;color:var(--grey);text-transform:uppercase;display:block;margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
textarea{resize:vertical;font-family:inherit}
.statusrow{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.statusrow button{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:11px}
.statusrow button.on{background:var(--deep);color:#fff;border-color:var(--deep);font-weight:bold}
.touch{border-left:3px solid var(--teal);padding:6px 10px;margin:6px 0;background:#fbfaf6;font-size:12px;border-radius:0 7px 7px 0}
.touch .d{color:var(--grey);font-size:10px}
.gen{white-space:pre-wrap;background:#fbfaf6;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;margin-top:8px;line-height:1.6}
.gen[dir=rtl]{text-align:right;font-size:14px}
.copyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chartrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.chartbox h3{font-size:13px;color:var(--deep);margin-bottom:10px}
.chartbox canvas{max-height:260px}
.rowitem{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rowitem .grow{flex:1;min-width:200px}
.pill{font-size:10px;padding:2px 8px;border-radius:9px;background:#f3efe4;color:var(--grey)}
.pill.red{background:#fdecea;color:var(--bad);font-weight:bold}
.pill.amber{background:#fff6e0;color:#8a6d00;font-weight:bold}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.report h3{color:var(--deep)}
.report pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.6;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s}
/* decline modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:flex;align-items:center;justify-content:center}
#modal .box{background:#fff;border-radius:14px;padding:24px;width:min(430px,92%)}
#modal h3{color:var(--deep);margin-bottom:10px}
/* catalog */
#catalog{position:fixed;inset:0;background:#fff;z-index:200;overflow-y:auto}
.cat-head{background:var(--deep);color:#fff;padding:28px 34px}
.cat-head .brand{font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.8}
.cat-head h1{font-family:Georgia,serif;font-size:28px;margin-top:6px}
.cat-head .sub{font-size:13px;opacity:.85;margin-top:4px}
.cat-tools{padding:10px 34px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fbfaf6}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:26px 34px}
.book{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);break-inside:avoid}
.book .cov{height:210px;background:#efeade;display:flex;align-items:center;justify-content:center;overflow:hidden}
.book .cov img{width:100%;height:100%;object-fit:cover}
.book .cov .spine{width:70%;height:80%;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-size:30px;font-weight:bold}
.book .inf{padding:10px 12px}
.book .ti{font-family:Georgia,serif;font-size:14px;font-weight:bold;line-height:1.3}
.book .au{font-size:11px;color:var(--grey);margin-top:3px}
.book .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.book .pr{background:var(--teal);color:#fff;font-size:11px;font-weight:bold;border-radius:7px;padding:2px 8px}
.book .is{font-size:9px;color:var(--grey)}
.cat-foot{padding:18px 34px;color:var(--grey);font-size:11px;border-top:1px solid var(--line)}
body.printing #app,body.printing #login,body.printing #toast,body.printing #season{display:none!important}
@media print{.cat-tools{display:none}#catalog{position:static}.cat-grid{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
@media(max-width:700px){.grid2{grid-template-columns:1fr}#dossier{padding:14px}.cat-grid{padding:16px}}
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>UBCC / Legenda</h1>
  <p>B2B Account Engine · authorized team only</p>
  <div id="loginStep1">
    <input id="lemail" type="email" placeholder="Email" autocomplete="username">
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
    <label style="font-size:12px;color:var(--grey);display:flex;gap:6px;align-items:center;margin-bottom:10px"><input type="checkbox" id="lremember" style="width:auto;margin:0" onchange="localStorage.setItem('b2b_remember',this.checked?'1':'0');location.reload()"> Remember this device (uncheck on shared computers)</label>
    <button id="lbtn" onclick="doLogin()">Enter</button>
  </div>
  <div id="loginStep2" class="hidden">
    <p style="margin-bottom:8px;font-size:13px">Enter the 6-digit code from your authenticator app:</p>
    <input id="lcode" inputmode="numeric" maxlength="6" placeholder="123456">
    <button onclick="verifyMfaLogin()">Verify</button>
  </div>
  <div id="loginerr"></div>
</div>

<div id="app" class="hidden">
<header>
  <h1>UBCC / Legenda · B2B</h1>
  <nav id="mainnav">
    <button data-v="board" class="on" onclick="go('board')">Board</button>
    <button data-v="today" onclick="go('today')">Today</button>
    <button data-v="titles" onclick="go('titles')">Title Lists</button>
    <button data-v="analytics" onclick="go('analytics')">Analytics</button>
    <button data-v="reports" onclick="go('reports')">Radar Reports</button>
    <button data-v="health" onclick="go('health')">Data Health</button>
    <button data-v="declined" onclick="go('declined')">Declined</button>
  </nav>
  <span id="who"></span>
  <button class="btn small" id="secBtn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="openSecurity()">2FA</button>
  <button class="btn small" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button>
</header>
<div id="season"></div>
<main>
  <div id="v-board">
    <div class="kpis" id="boardKpis"></div>
    <div class="controls">
      <input id="q" placeholder="Search name, hook, notes..." oninput="renderBoard()">
      <select id="fcat" onchange="renderBoard()"><option value="">All categories</option></select>
      <select id="fscore" onchange="renderBoard()"><option value="">Any score</option><option value="8">8+</option><option value="6">6+</option></select>
      <button class="btn salesonly" onclick="openNew()">+ Add account</button>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div id="v-today" class="hidden"></div>
  <div id="v-titles" class="hidden"></div>
  <div id="v-analytics" class="hidden">
    <div class="kpis" id="anaKpis"></div>
    <div class="chartrow">
      <div class="chartbox"><h3>Pipeline funnel</h3><canvas id="cFunnel"></canvas></div>
      <div class="chartbox"><h3>Win rate by category (closed deals)</h3><canvas id="cWin"></canvas></div>
      <div class="chartbox"><h3>Activity: touches per week</h3><canvas id="cAct"></canvas></div>
      <div class="chartbox"><h3>Accounts by category</h3><canvas id="cCat"></canvas></div>
    </div>
    <div class="sect"><h3>Monthly KPI targets (from your plan)</h3><div id="kpiTargets"></div></div>
  </div>
  <div id="v-reports" class="hidden"></div>
  <div id="v-health" class="hidden"></div>
  <div id="v-declined" class="hidden"></div>
</main>
</div>

<div id="overlay" class="hidden" onclick="closeDossier()"></div>
<div id="dossier" class="hidden"></div>
<div id="modal" class="hidden"></div>
<div id="catalog" class="hidden"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://qxjlgfqvqhtrbttcgysw.supabase.co";
const SUPABASE_KEY = "sb_publishable_FOeLR9B2zA6pRow0dcDqCw_2bHgiVar";
const REMEMBER = localStorage.getItem('b2b_remember') === '1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{storage: REMEMBER ? window.localStorage : window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false}});
const STATUSES = ["To Contact","Contacted","Meeting","Proposal","Pilot","Won","Dead"];
const STAGE_PROB = {"To Contact":0.05,"Contacted":0.15,"Meeting":0.35,"Proposal":0.55,"Pilot":0.75,"Won":1,"Dead":0,"Declined":0};
const DECLINE_REASONS = ["Not a fit for B2B strategy","Contacted before, bad experience","No realistic budget","Wrong segment for books","Asked not to be contacted","Closed / out of business","Other"];
let ACC = [], TOUCH = [], LISTS = [], SETTINGS = {}, charts = {}, ROLE = 'sales';

const active = () => ACC.filter(a=>a.status!=='Declined');
const declined = () => ACC.filter(a=>a.status==='Declined');

/* ---------- boot / share mode ---------- */
const shareCode = new URLSearchParams(location.search).get('share');
function whoFromEmail(email){ return email.startsWith('shereen') ? 'Shereen' : 'Ahmad'; }
async function mfaGateNeeded(){
  try{ const {data} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    return !!data && data.nextLevel === 'aal2' && data.currentLevel !== 'aal2'; }
  catch(e){ return false; } }
async function boot(){
  if(shareCode){ return renderSharedCatalog(shareCode); }
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ document.getElementById('login').classList.remove('hidden'); return; }
  if(await mfaGateNeeded()){ showMfaStep(); return; }
  const email = session.user.email || '';
  ROLE = email.startsWith('shereen') ? 'curator' : 'sales';
  localStorage.setItem('b2b_user', whoFromEmail(email));
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if(ROLE==='curator'){ document.querySelectorAll('.salesonly').forEach(e=>e.classList.add('hidden')); }
  document.getElementById('who').textContent = whoFromEmail(email) + (ROLE==='curator'?' · curation':'');
  await loadAll(); seasonBanner(); startIdleWatch(); renderSecurityBadge();
  if(ROLE==='curator'){ go('titles'); } else { renderBoard(); }
}
let FAILS = 0;
async function doLogin(){
  const btn=document.getElementById('lbtn'); if(btn.disabled) return;
  const {error} = await sb.auth.signInWithPassword({email:lemail.value.trim().toLowerCase(), password:lpass.value});
  if(error){
    FAILS++; const wait=Math.min(60, 5*Math.pow(2, FAILS-1));
    document.getElementById('loginerr').textContent = `Login failed. Try again in ${wait}s.`;
    btn.disabled=true; setTimeout(()=>{btn.disabled=false; document.getElementById('loginerr').textContent='';}, wait*1000);
    return; }
  FAILS=0; document.getElementById('loginerr').textContent='';
  if(await mfaGateNeeded()){ showMfaStep(); return; }
  boot(); }
function showMfaStep(){
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginStep1').classList.add('hidden');
  document.getElementById('loginStep2').classList.remove('hidden');
  document.getElementById('lcode').focus(); }
async function verifyMfaLogin(){
  const code=document.getElementById('lcode').value.trim();
  const {data:fs} = await sb.auth.mfa.listFactors();
  const f=(fs && fs.totp && fs.totp[0]) || null;
  if(!f){ document.getElementById('loginerr').textContent='No 2FA factor found.'; return; }
  const ch=await sb.auth.mfa.challenge({factorId:f.id});
  if(ch.error){ document.getElementById('loginerr').textContent=ch.error.message; return; }
  const vr=await sb.auth.mfa.verify({factorId:f.id, challengeId:ch.data.id, code});
  if(vr.error){ document.getElementById('loginerr').textContent='Wrong code, try again.'; return; }
  document.getElementById('loginStep2').classList.add('hidden');
  document.getElementById('loginStep1').classList.remove('hidden');
  document.getElementById('loginerr').textContent='';
  boot(); }
async function loadAll(){
  const [a,t,s,l] = await Promise.all([
    sb.from('b2b_accounts').select('*').order('score',{ascending:false,nullsFirst:false}),
    sb.from('b2b_touches').select('*').order('at',{ascending:false}),
    sb.from('b2b_settings').select('*'),
    sb.from('b2b_lists').select('*').order('created_at',{ascending:false})]);
  ACC = a.data||[]; TOUCH = t.data||[]; LISTS = l.data||[];
  SETTINGS = Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
  const cats=[...new Set(active().map(x=>x.category).filter(Boolean))].sort();
  fcat.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join(''); }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200);}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function by(){return localStorage.getItem('b2b_user')||'Team';}
function canEdit(){return ROLE==='sales';}

/* ---------- season ---------- */
function seasonBanner(){
  const now=new Date(), msg=[];
  const aibf=new Date('2026-09-24'); const dA=Math.ceil((aibf-now)/864e5);
  if(dA>0&&dA<120) msg.push(`Amman Book Fair in ${dA} days (24 Sep - 3 Oct)`);
  const m=now.getMonth()+1;
  if(m>=10||m<=1) msg.push("GIFTING WINDOW OPEN: corporate Ramadan/year-end decisions happen now");
  const ram=new Date('2027-02-08'); const dR=Math.ceil((ram-now)/864e5);
  if(dR>0&&dR<190) msg.push(`Ramadan 2027 in ${dR} days: close gifting deals before mid-January`);
  if(m>=5&&m<=8) msg.push("Summer: hotel kids clubs at peak, pitch reading programs now");
  document.getElementById('season').textContent = msg.join("  ·  ") || "No seasonal window active"; }

/* ---------- nav ---------- */
function go(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['board','today','titles','analytics','reports','health','declined'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==v));
  if(v==='board')renderBoard(); if(v==='today')renderToday(); if(v==='titles')renderTitles();
  if(v==='analytics')renderAnalytics(); if(v==='reports')renderReports(); if(v==='health')renderHealth();
  if(v==='declined')renderDeclined(); }

function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase(), c=fcat.value, ms=fscore.value;
  return active().filter(a=>(!c||a.category===c)&&(!ms||(a.score||0)>=+ms)&&(!q||(a.name+' '+(a.hook||'')+' '+(a.notes||'')).toLowerCase().includes(q))); }
function lastTouch(id){const t=TOUCH.find(x=>x.account_id===id);return t?new Date(t.at):null;}
function isStale(a){ if(!["Contacted","Meeting","Proposal","Pilot"].includes(a.status)) return false;
  const t=lastTouch(a.id)||new Date(a.updated_at); return (Date.now()-t)/864e5>14; }

function renderBoard(){
  const f=filtered(), b=document.getElementById('board'); b.innerHTML='';
  STATUSES.forEach(s=>{
    const items=f.filter(a=>a.status===s);
    const col=document.createElement('div'); col.className='col';
    col.innerHTML=`<h2>${s}<span class="n">${items.length}</span></h2>`+items.map(a=>`
      <div class="card" onclick="openDossier(${a.id})">
        <span class="score ${a.score>=8?'hi':''}">${a.score??'?'}</span>
        <div class="t">${esc(a.name)}</div>
        <div class="m">${esc(a.decision_maker||a.area||'')}</div>
        ${isStale(a)?'<div class="flag">STALE 14+ days</div>':''}
        ${a.next_action_date&&new Date(a.next_action_date)<new Date()?'<div class="flag">OVERDUE action</div>':''}
        <span class="badge">${esc(a.category||'')}</span>${a.verified===false?'<span class="badge" style="color:var(--rust);border-color:var(--rust)">unverified</span>':''}
        ${LISTS.some(l=>l.account_id===a.id)?'<span class="badge" style="color:var(--gold);border-color:var(--gold)">titles ready</span>':''}
      </div>`).join('');
    b.appendChild(col); });
  const inMotion=f.filter(a=>["Contacted","Meeting","Proposal","Pilot"].includes(a.status)).length;
  const wt=f.reduce((s,a)=>s+(+a.est_value_jod||0)*STAGE_PROB[a.status],0);
  document.getElementById('boardKpis').innerHTML=kpi('Active accounts',f.length)+kpi('In motion',inMotion)+kpi('Won',f.filter(a=>a.status==='Won').length)+kpi('Hot untouched (8+)',f.filter(a=>a.score>=8&&a.status==='To Contact').length)+kpi('Weighted pipeline',`JOD ${Math.round(wt).toLocaleString()}`)+kpi('Declined (archived)',declined().length); }
function kpi(l,v){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;}

/* ---------- TODAY ---------- */
function renderToday(){

const HDR_MAP=[[/^(title|book|name|العنوان|الكتاب|الاسم)/i,'title'],[/^(author|writer|المؤلف|الكاتب)/i,'author'],[/isbn|ردمك/i,'isbn'],[/price|سعر|jod|دينار/i,'price'],[/lang|لغة/i,'language'],[/categ|genre|تصنيف|فئة/i,'category'],[/note|ملاحظ/i,'note']];
function mapHeader(h){for(const [re,k] of HDR_MAP) if(re.test(String(h).trim())) return k; return null;}
async function uploadList(){
  const f=document.getElementById('upFile').files[0];
  const name=document.getElementById('upName').value.trim();
  const msg=document.getElementById('upMsg');
  if(!f||!name){msg.textContent='Choose a file and give the list a name.';return;}
  msg.textContent='Reading file...';
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(!raw.length){msg.textContent='File looks empty.';return;}
    const headers=raw[0].map(String);
    const keys=headers.map(mapHeader);
    const parsed=raw.slice(1).filter(r=>r.some(c=>String(c).trim())).slice(0,600).map(r=>{
      const o={extra:{}};
      r.forEach((c,i)=>{const k=keys[i];const v=String(c).trim();
        if(k&&!o[k])o[k]=v; else if(headers[i])o.extra[headers[i]]=v;});
      if(!o.title){o.title=String(r.find(c=>String(c).trim())||'').trim();}
      return o;});
    msg.textContent='Uploading file...';
    const path=`lists/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,'_')}`;
    const up=await sb.storage.from('b2b-files').upload(path,f);
    if(up.error){msg.textContent='Storage error: '+up.error.message;return;}
    const ins=await sb.from('b2b_lists').insert({
      account_id:document.getElementById('upAcc').value||null,
      name, note:document.getElementById('upNote').value.trim(),
      file_path:path, file_name:f.name, parsed, uploaded_by:by()}).select();
    if(ins.error){msg.textContent='DB error: '+ins.error.message;return;}
    msg.textContent='';toast(`Uploaded: ${name} (${parsed.length} titles)`);
    await loadAll(); renderTitles();
  }catch(e){msg.textContent='Could not read this file: '+e.message;}
}
async function downloadList(id){
  const l=LISTS.find(x=>x.id===id); if(!l||!l.file_path)return;
  const {data,error}=await sb.storage.from('b2b-files').createSignedUrl(l.file_path,3600);
  if(error){toast('Download error: '+error.message);return;}
  window.open(data.signedUrl,'_blank'); }
async function delList(id){
  if(!confirm('Delete this list? The Excel file is removed too.'))return;
  const l=LISTS.find(x=>x.id===id);
  if(l&&l.file_path) await sb.storage.from('b2b-files').remove([l.file_path]);
  await sb.from('b2b_lists').delete().eq('id',id);
  toast('List deleted'); await loadAll(); renderTitles(); }
function copyShare(id){

function copyListText(id){

/* ---------- CATALOG (branded, with covers) ---------- */
const SPINE_COLORS=['#056A78','#008EA6','#A8894C','#B05C3B','#5c574b','#2e5f4e'];
function bookCard(t,i){
  const isbn=(t.isbn||'').replace(/[^0-9Xx]/g,'');
  const cover=isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:'';
  const spine=`<div class="spine" style="background:${SPINE_COLORS[i%SPINE_COLORS.length]}">${esc((t.title||'?').charAt(0).toUpperCase())}</div>`;
  return `<div class="book"><div class="cov" data-title="${esc(t.title)}" data-author="${esc(t.author||'')}" data-i="${i}">
      ${cover?`<img src="${cover}" onerror="covErr(this)" data-i="${i}">`:spine}</div>
    <div class="inf"><div class="ti">${esc(t.title||'Untitled')}</div>
      <div class="au">${esc(t.author||'')}</div>
      <div class="meta">${t.price?`<span class="pr">JOD ${esc(t.price)}</span>`:'<span></span>'}<span class="is">${esc(t.isbn||'')}</span></div>
    </div></div>`; }
async function fillMissingCovers(container){
  const covs=[...container.querySelectorAll('.cov')];
  let budget=30;
  for(const c of covs){
    if(c.querySelector('img'))continue; if(budget--<=0)break;
    const q=encodeURIComponent(`intitle:${c.dataset.title} ${c.dataset.author?('inauthor:'+c.dataset.author):''}`);
    try{
      const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
      const j=await r.json();
      const th=j.items?.[0]?.volumeInfo?.imageLinks?.thumbnail;
      if(th){const img=document.createElement('img');img.src=th.replace('http://','https://');
        c.innerHTML='';c.appendChild(img);}
    }catch(e){/* offline or rate limited: spine stays */}
  } }
function covErr(img){
  const cov=img.parentElement; if(!cov)return;
  const i=+(cov.dataset.i||0), t=cov.dataset.title||'?';
  cov.innerHTML=`<div class="spine" style="background:${SPINE_COLORS[i%SPINE_COLORS.length]}">${esc(t.charAt(0).toUpperCase())}</div>`; }
function catalogHTML(listName, clientName, note, parsed, internal){
  return `
  <div class="cat-head"><div class="brand">UBCC · Legenda Bookstore · Amman</div>
    <h1>${esc(listName)}</h1>
    <div class="sub">${clientName?('Curated for '+esc(clientName)+' · '):''}${esc(note||'')} · ${parsed.length} titles · ${new Date().toLocaleDateString()}</div></div>
  ${internal?`<div class="cat-tools">
    <button class="btn primary" onclick="printCatalog()">Print / Save as PDF</button>
    <button class="btn" onclick="closeCatalog()">Close</button>
    <span style="font-size:11px;color:var(--grey);align-self:center">Covers load automatically from ISBN or title. Missing covers show a colored spine, still looks clean in print.</span></div>`:''}
  <div class="cat-grid" id="catGrid">${parsed.map((t,i)=>bookCard(t,i)).join('')}</div>
  <div class="cat-foot">Prepared by UBCC / Legenda Bookstore · legendabookstore.com · If it is listed, it is available. Prices in JOD include local delivery in Amman.</div>`; }
function openCatalog(id){
  const l=LISTS.find(x=>x.id===id); if(!l)return;
  const acc=ACC.find(a=>a.id===l.account_id);
  const c=document.getElementById('catalog');
  c.innerHTML=catalogHTML(l.name, acc?acc.name:'', l.note, l.parsed||[], true);
  c.classList.remove('hidden'); document.body.classList.add('printing');

function closeCatalog(){document.getElementById('catalog').classList.add('hidden');document.body.classList.remove('printing');

function printCatalog(){window.print();}
async function renderSharedCatalog(code){
  const c=document.getElementById('catalog');
  c.innerHTML='<div style="padding:40px;font-family:Georgia,serif;color:#056A78">Loading selection...</div>';

/* ---------- ANALYTICS ---------- */
function renderAnalytics(){
  const A=active();
  const cnt=Object.fromEntries(STATUSES.map(s=>[s,A.filter(a=>a.status===s).length]));
  const closedCats={}; A.forEach(a=>{if(['Won','Dead'].includes(a.status)){closedCats[a.category]=closedCats[a.category]||{w:0,d:0}; a.status==='Won'?closedCats[a.category].w++:closedCats[a.category].d++;}});
  const catCount={}; A.forEach(a=>{catCount[a.category||'Other']=(catCount[a.category||'Other']||0)+1;});
  const topCats=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const weeks=[...Array(8)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-7*(7-i));return d;});
  const wk=weeks.map(w=>{const w2=new Date(w);w2.setDate(w2.getDate()+7);return TOUCH.filter(t=>{const x=new Date(t.at);return x>=w&&x<w2;}).length;});
  const wt=A.reduce((s,a)=>s+(+a.est_value_jod||0)*STAGE_PROB[a.status],0);
  const resp=A.filter(a=>a.response&&a.response.trim()).length, sent=A.filter(a=>a.outreach_date&&String(a.outreach_date).trim()).length;
  document.getElementById('anaKpis').innerHTML=kpi('Weighted pipeline',`JOD ${Math.round(wt).toLocaleString()}`)+kpi('Outreach sent',sent)+kpi('Responses',resp)+kpi('Response rate',sent?Math.round(resp/sent*100)+'%':'0%')+kpi('Meetings+',cnt['Meeting']+cnt['Proposal']+cnt['Pilot']+cnt['Won'])+kpi('Won / Dead / Declined',`${cnt['Won']} / ${cnt['Dead']} / ${declined().length}`);
  const mk=(id,cfg)=>{charts[id]&&charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg);};
  mk('cFunnel',{type:'bar',data:{labels:STATUSES,datasets:[{data:STATUSES.map(s=>cnt[s]),backgroundColor:['#8a8578','#A8894C','#056A78','#008EA6','#B05C3B','#2e7d32','#c62828']}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  mk('cWin',{type:'bar',data:{labels:Object.keys(closedCats),datasets:[{label:'Won',data:Object.values(closedCats).map(x=>x.w),backgroundColor:'#2e7d32'},{label:'Dead',data:Object.values(closedCats).map(x=>x.d),backgroundColor:'#c62828'}]},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}}}});
  mk('cAct',{type:'line',data:{labels:weeks.map(w=>(w.getMonth()+1)+'/'+w.getDate()),datasets:[{label:'Touches',data:wk,borderColor:'#008EA6',backgroundColor:'#008EA620',fill:true,tension:.3},{label:'Weekly target (10)',data:wk.map(()=>10),borderColor:'#B05C3B',borderDash:[6,4],pointRadius:0}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  mk('cCat',{type:'doughnut',data:{labels:topCats.map(x=>x[0]),datasets:[{data:topCats.map(x=>x[1]),backgroundColor:['#008EA6','#056A78','#A8894C','#B05C3B','#8a8578','#6aa8b5','#c9b88a','#d99b7c']}]},options:{plugins:{legend:{position:'right'}},cutout:'58%'}});
  const T=SETTINGS.kpi_targets||{};
  document.getElementById('kpiTargets').innerHTML='<table style="width:100%;font-size:12px;border-collapse:collapse">'+Object.entries(T).map(([k,v])=>{
    let cur='';
    if(k==='Outreach messages sent')cur=sent; if(k==='Responses received')cur=resp;
    if(k==='Prospects researched & listed')cur=ACC.length; if(k==='Meetings scheduled')cur=cnt['Meeting']+cnt['Proposal']+cnt['Pilot']+cnt['Won'];
    if(k==='Pilots signed')cur=cnt['Pilot']+cnt['Won']; if(k==='Locations with books live')cur=cnt['Won'];
    const pct=cur!==''&&v?Math.min(100,Math.round(cur/v*100)):null;
    return `<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 4px">${esc(k)}</td><td style="text-align:right;font-weight:bold">${cur!==''?cur:'-'}</td><td style="text-align:right;color:var(--grey)">target ${v}</td><td style="width:30%;padding:6px"><div style="background:#eee;border-radius:6px;height:8px">${pct!==null?`<div style="width:${pct}%;background:${pct>=100?'var(--ok)':'var(--teal)'};height:8px;border-radius:6px"></div>`:''}</div></td></tr>`;}).join('')+'</table>'; }

let ENROLL=null, IDLE_T=null;
async function renderSecurityBadge(){
  try{ const {data:fs}=await sb.auth.mfa.listFactors();
    const on=!!(fs && fs.totp && fs.totp.length);
    document.getElementById('secBtn').textContent = on ? '2FA ✓' : 'Enable 2FA'; }catch(e){} }
async function openSecurity(){
  const m=document.getElementById('modal');
  const {data:fs}=await sb.auth.mfa.listFactors();
  const f=(fs && fs.totp && fs.totp[0]) || null;
  m.classList.remove('hidden');
  if(f){
    m.innerHTML=`<div class="box"><h3 class="serif">Two-factor authentication</h3>
      <p style="font-size:13px;margin:8px 0;line-height:1.6">2FA is ON. Every login asks for your authenticator code, and the database itself refuses any session that skipped it.</p>
      <div class="copyrow"><button class="btn danger" onclick="disableMfa('${f.id}')">Turn off 2FA</button>
      <button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Close</button></div></div>`;
    return; }
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp', friendlyName:'UBCC B2B'});
  if(error){ toast(error.message); m.classList.add('hidden'); return; }
  ENROLL=data;
  m.innerHTML=`<div class="box"><h3 class="serif">Enable two-factor authentication</h3>
    <p style="font-size:12px;color:var(--grey);margin:6px 0">Scan with Google Authenticator, Authy or any TOTP app, then enter the 6-digit code it shows.</p>
    <div style="background:#fff;padding:8px;text-align:center">${ENROLL.totp.qr_code}</div>
    <p style="font-size:10px;color:var(--grey);word-break:break-all;margin:6px 0">Manual key: ${ENROLL.totp.secret}</p>
    <input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="123456" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:7px">
    <div class="copyrow" style="margin-top:10px"><button class="btn primary" onclick="confirmEnroll()">Activate 2FA</button>
    <button class="btn" onclick="cancelEnroll()">Cancel</button></div></div>`; }
async function confirmEnroll(){
  const code=document.getElementById('mfaCode').value.trim();
  const ch=await sb.auth.mfa.challenge({factorId:ENROLL.id});
  if(ch.error){ toast(ch.error.message); return; }
  const vr=await sb.auth.mfa.verify({factorId:ENROLL.id, challengeId:ch.data.id, code});
  if(vr.error){ toast('Wrong code, try again'); return; }
  document.getElementById('modal').classList.add('hidden');
  toast('2FA is ON for this account'); renderSecurityBadge(); }
async function cancelEnroll(){
  try{ await sb.auth.mfa.unenroll({factorId:ENROLL.id}); }catch(e){}
  document.getElementById('modal').classList.add('hidden'); }
async function disableMfa(id){
  if(!confirm('Turn off two-factor authentication?')) return;
  const {error}=await sb.auth.mfa.unenroll({factorId:id});
  if(error){ toast(error.message); return; }
  toast('2FA turned off'); document.getElementById('modal').classList.add('hidden'); renderSecurityBadge(); }
function startIdleWatch(){
  const reset=()=>{ clearTimeout(IDLE_T); IDLE_T=setTimeout(()=>{ sb.auth.signOut().then(()=>location.reload()); }, 30*60*1000); };
  ['click','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,reset,{passive:true}));
  reset(); }

  const a=CUR;
  const p=`Write a persuasive but culturally-calibrated Jordanian B2B outreach email (Arabic AND English versions) from Ahmad El-Hafez of UBCC/Legenda Bookstore (distributor since 1995, 20,000+ titles, consignment/Net-60 flexible) to this prospect. Use ONLY these facts, invent nothing:\nAccount: ${a.name} | Category: ${a.category} | Area: ${a.area}\nResearch hook: ${a.hook||'none'}\nDecision maker: ${a.decision_maker||'unknown'} | Contact: ${a.contact_person||'unknown'}\nProposed model: ${a.deal_model||'consignment'}\nStatus: ${a.status} | Notes: ${a.notes||'none'}\nRules: warm formal tone, relationship-first, no hard sell, one clear 20-minute coffee ask, mention zero upfront cost if consignment, max 120 words per language, no em-dashes.`;
  navigator.clipboard.writeText(p).then(()=>toast('AI prompt copied, paste into Claude')); }
function copyEl(id){const el=document.getElementById(id);navigator.clipboard.writeText(el.innerText).then(()=>toast('Copied'));}

/* ---------- CSV export ---------- */
function exportCSV(){
  const cols=['name','category','area','status','score','contact_person','phone','email','instagram','decision_maker','deal_model','hook','next_action','next_action_date','est_value_jod','declined_reason','notes'];
  const rows=[cols.join(',')].concat(ACC.map(a=>cols.map(c=>'"'+String(a[c]??'').replace(/"/g,'""')+'"').join(',')));
  const b=new Blob(["﻿"+rows.join("\n")],{type:'text/csv'});
  const u=URL.createObjectURL(b); const l=document.createElement('a'); l.href=u; l.download='ubcc-b2b-pipeline.csv'; l.click(); }
