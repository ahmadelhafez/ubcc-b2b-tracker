<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F16725">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>UBCC / Legenda · B2B Account Engine</title>
<link rel="preconnect" href="https://qxjlgfqvqhtrbttcgysw.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<style>
:root{
  /* UBCC orange system: #F6891F bright / #F16725 deep, extracted from the UBCC logo.
     Note: --teal/--teal2/--tealbg are legacy names now carrying the UBCC brand colors. */
  --bg:#FAF8F5; --surface:#FFFFFF; --surface2:#F4F1EB; --ink:#211E1A; --ink2:#877F73;
  --line:#ECE7DE; --line2:#DDD6C9;
  --brand:#F6891F; --brand2:#F16725;
  --teal:#C05207; --teal2:#F6891F; --gold:#A8894C; --rust:#B05C3B;
  --ok:#2F7D4F; --warn:#B07C1F; --bad:#B3403A;
  --okbg:#EAF3ED; --warnbg:#F8F0DD; --badbg:#F7E8E6; --tealbg:#FBEEDF;
  --r-s:6px; --r-m:12px; --dur:.18s; --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 8px 30px rgba(45,35,20,.13);
  --font-ui:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-d:'Fraunces',Georgia,serif;
}
[data-theme="dark"]{
  --bg:#141210; --surface:#1C1916; --surface2:#26221D; --ink:#EAE5DC; --ink2:#9C948A;
  --line:#2F2A23; --line2:#3D362D;
  --brand:#F6891F; --brand2:#F16725;
  --teal:#FFA95E; --teal2:#F6891F; --gold:#C4A76A; --rust:#D08663;
  --ok:#6FBF8F; --warn:#D3A64E; --bad:#E07A73;
  --okbg:#1E2B22; --warnbg:#2E2717; --badbg:#301E1C; --tealbg:#2C2013;
  --shadow:0 8px 30px rgba(0,0,0,.55);
}
@media (prefers-reduced-motion: reduce){ :root{--dur:0s} }
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;transition:background var(--dur) var(--ease)}
h1,h2,.display{font-family:var(--font-d);letter-spacing:.2px}
button{cursor:pointer;font-family:inherit;color:inherit}
a{color:var(--teal)}
input,select,textarea{font-family:inherit;color:var(--ink);background:var(--surface);accent-color:var(--teal)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
[dir=rtl],[lang=ar]{line-height:1.85;font-size:15px}

/* login */
#login{max-width:380px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow)}
#login h1{color:var(--teal);font-size:24px;margin-bottom:4px}
#login p{color:var(--ink2);font-size:12px;margin-bottom:18px}
#login input{width:100%;padding:11px 12px;margin-bottom:10px;border:1px solid var(--line2);border-radius:var(--r-s);font-size:14px}
#login button{width:100%;padding:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;border-radius:var(--r-s);font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(241,103,37,.3);transition:transform var(--dur) var(--ease),opacity var(--dur)}
#login button:active{transform:scale(.97)}
#login button:disabled{opacity:.5;cursor:default}
#loginerr{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px}

/* shell */
header{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header .brand{font-family:var(--font-d);font-weight:700;font-size:17px;color:var(--teal)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:transparent;border:none;color:var(--ink2);padding:7px 13px;border-radius:20px;font-size:13px;font-weight:500;transition:background var(--dur) var(--ease),color var(--dur)}
nav button:hover{background:var(--surface2);color:var(--ink)}
nav button.on{background:var(--tealbg);color:var(--teal);font-weight:600}
#hright{margin-left:auto;display:flex;align-items:center;gap:8px}
#who{font-size:12px;color:var(--ink2)}
.hbtn{background:transparent;border:1px solid var(--line2);border-radius:20px;padding:5px 11px;font-size:12px;transition:background var(--dur),border-color var(--dur)}
.hbtn:hover{background:var(--surface2)}
#goal{display:flex;align-items:center;gap:6px;cursor:pointer}
#goal svg{transform:rotate(-90deg)}
#goal .lbl{font-size:11px;color:var(--ink2)}
#season{background:linear-gradient(90deg,var(--tealbg),color-mix(in srgb,var(--brand) 14%,var(--surface)));color:var(--ink);padding:7px 20px;font-size:12px;text-align:center;border-bottom:1px solid var(--line)}
main{padding:18px 20px calc(20px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}

/* controls + buttons */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input,.controls select{padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r-s);font-size:13px}
.controls input{min-width:210px}
.btn{padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;transition:background var(--dur) var(--ease),transform var(--dur),border-color var(--dur)}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none;font-weight:600;box-shadow:0 2px 8px rgba(241,103,37,.28)}
.btn.primary:hover{filter:brightness(1.06);box-shadow:0 3px 12px rgba(241,103,37,.38)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{padding:4px 10px;font-size:12px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 16px}
.kpi .l{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .v{font-size:24px;font-weight:700;color:var(--teal);font-family:var(--font-d)}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{min-width:262px;max-width:262px;background:var(--surface2);border-radius:var(--r-m);padding:8px;flex-shrink:0;transition:background var(--dur) var(--ease);border:1px dashed transparent}
.col.dragover{border-color:var(--teal);background:var(--tealbg)}
.col h2{font-family:var(--font-ui);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink2);padding:6px 8px;display:flex;justify-content:space-between;font-weight:600}
.col .n{background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;line-height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;cursor:pointer;transition:border-color var(--dur) var(--ease),transform var(--dur),box-shadow var(--dur);position:relative}
.card:hover{border-color:var(--teal);transform:translateY(-1px)}
.card.dragging{opacity:.4;transform:rotate(2deg)}
.card.rot{border-left:3px solid var(--bad)}
.card .t{font-size:13px;font-weight:600;padding-right:34px}
.card .m{font-size:11px;color:var(--ink2);margin-top:3px}
.badge{display:inline-block;font-size:10px;border-radius:7px;padding:1px 8px;margin-top:6px;background:var(--tealbg);color:var(--teal);margin-right:3px;font-weight:500}
.badge.gold{background:var(--warnbg);color:var(--gold)}
.badge.red{background:var(--badbg);color:var(--bad)}
.score{position:absolute;top:9px;right:10px;font-size:11px;font-weight:700;color:#fff;background:var(--teal2);border-radius:7px;padding:1px 7px}
.score.hi{background:var(--rust)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.g{background:var(--ok)} .dot.r{background:var(--bad)} .dot.a{background:var(--warn)}
.rotlbl{font-size:10px;color:var(--bad);font-weight:600;margin-top:4px}

/* skeleton */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{border-radius:10px;height:74px;margin:7px 0;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:800px 100%;animation:shimmer 1.2s infinite linear}

/* dossier */
#overlay{position:fixed;inset:0;background:rgba(20,17,12,.45);z-index:90;animation:fadein var(--dur) var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#dossier{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg);z-index:100;overflow-y:auto;box-shadow:var(--shadow);padding:22px;animation:slidein .25s var(--ease)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#dossier h2{color:var(--teal);font-size:21px;margin-bottom:2px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;margin-top:12px}
.sect h3{font-size:12px;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{font-size:10px;color:var(--ink2);text-transform:uppercase;display:block;margin-bottom:3px;font-weight:600;letter-spacing:.4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r-s);font-size:13px;transition:border-color var(--dur)}
.field input:hover,.field textarea:hover{border-color:var(--ink2)}
textarea{resize:vertical}
.statusrow{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.statusrow button{padding:6px 12px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);font-size:11px;font-weight:500;transition:all var(--dur) var(--ease)}
.statusrow button:hover{border-color:var(--teal)}
.statusrow button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.touch{border-left:3px solid var(--teal2);padding:7px 11px;margin:6px 0;background:var(--surface2);font-size:12px;border-radius:0 8px 8px 0}
.touch .d{color:var(--ink2);font-size:10px}
.gen{white-space:pre-wrap;background:var(--surface2);border:1px dashed var(--line2);border-radius:var(--r-s);padding:12px;font-size:13px;margin-top:8px;line-height:1.65}
.gen[dir=rtl]{text-align:right}
.copyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* charts + lists */
.chartrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.chartbox h3{font-size:12px;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
.chartbox canvas{max-height:260px}
.rowitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;transition:border-color var(--dur)}
.rowitem:hover{border-color:var(--line2)}
.rowitem .grow{flex:1;min-width:200px}
.pill{font-size:10px;padding:2px 9px;border-radius:9px;background:var(--surface2);color:var(--ink2);font-weight:500}
.pill.red{background:var(--badbg);color:var(--bad);font-weight:600}
.pill.amber{background:var(--warnbg);color:var(--warn);font-weight:600}
.pill.green{background:var(--okbg);color:var(--ok);font-weight:600}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin-bottom:12px}
.report h3{color:var(--teal);font-family:var(--font-d)}
.report pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.6;margin-top:8px}
.empty{text-align:center;padding:36px 20px;color:var(--ink2)}
.empty .big{font-size:34px;margin-bottom:8px}
#toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:22px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s var(--ease);pointer-events:none;max-width:90vw}

/* modal + palette */
#modal,#palette{position:fixed;inset:0;background:rgba(20,17,12,.45);z-index:150;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
#modal .box{background:var(--surface);border-radius:16px;padding:24px;width:min(440px,92%);box-shadow:var(--shadow);animation:pop .2s var(--ease)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
#modal h3{color:var(--teal);margin-bottom:10px;font-family:var(--font-d)}
#palette .pbox{background:var(--surface);border-radius:14px;width:min(560px,94%);box-shadow:var(--shadow);overflow:hidden;animation:pop .18s var(--ease)}
#palette input{width:100%;padding:15px 18px;border:none;border-bottom:1px solid var(--line);font-size:15px;background:transparent;outline:none}
#plist{max-height:320px;overflow-y:auto}
.pitem{padding:11px 18px;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
.pitem.sel,.pitem:hover{background:var(--tealbg)}
.pitem .k{margin-left:auto;font-size:10px;color:var(--ink2);border:1px solid var(--line2);border-radius:4px;padding:1px 6px}

/* catalog */
#catalog{position:fixed;inset:0;background:var(--surface);z-index:200;overflow-y:auto}
/* Client-facing catalog stays LEGENDA teal deliberately */
.cat-head{background:#056A78;color:#fff;padding:28px 34px}
[data-theme="dark"] .cat-head{background:#0B3B44}
.cat-head .brand2{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;opacity:.85}
.cat-head h1{font-size:30px;margin-top:6px}
.cat-head .sub{font-size:13px;opacity:.9;margin-top:4px}
.cat-tools{padding:10px 34px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface2)}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:26px 34px}
.book{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface);break-inside:avoid;transition:transform var(--dur) var(--ease),box-shadow var(--dur)}
.book:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.book .cov{height:210px;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.book .cov img{width:100%;height:100%;object-fit:cover}
.book .cov .spine{width:70%;height:80%;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-d);font-size:30px;font-weight:700}
.book .inf{padding:10px 12px}
.book .ti{font-family:var(--font-d);font-size:14px;font-weight:600;line-height:1.3}
.book .au{font-size:11px;color:var(--ink2);margin-top:3px}
.book .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.book .pr{background:#056A78;color:#fff;font-size:11px;font-weight:700;border-radius:7px;padding:2px 8px}
.book .is{font-size:9px;color:var(--ink2)}
.cat-foot{padding:18px 34px;color:var(--ink2);font-size:11px;border-top:1px solid var(--line)}
body.printing #app,body.printing #login,body.printing #toast,body.printing #season,body.printing #bottomnav{display:none!important}
@media print{.cat-tools{display:none}#catalog{position:static}.cat-grid{grid-template-columns:repeat(3,1fr)}body{background:#fff}}

/* meeting mode */
#meet{position:fixed;inset:0;background:var(--bg);z-index:210;overflow-y:auto;padding:22px}
#meet .mh{font-family:var(--font-d);font-size:26px;color:var(--teal)}

/* mobile */
#bottomnav{display:none}
@media(max-width:760px){
  header nav{display:none}
  main{padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
  .grid2{grid-template-columns:1fr}
  #dossier{padding:16px;width:100%}
  .board{scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:10px}
  .col{min-width:calc(100vw - 48px);max-width:calc(100vw - 48px);scroll-snap-align:center;scroll-snap-stop:always}
  .cat-grid{padding:16px;gap:12px;grid-template-columns:repeat(2,1fr)}
  .cat-head{padding:20px 18px}.cat-tools{padding:10px 18px}
  #bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:80;padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  #bottomnav button{background:none;border:none;font-size:10.5px;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px;border-radius:10px;min-width:60px;font-weight:500}
  #bottomnav button.on{color:var(--teal);background:var(--tealbg)}
  #bottomnav .ic{font-size:19px;line-height:1}
  .btn,.statusrow button{padding:9px 14px}
}
</style>
</head>
<body>

<div id="login" class="hidden">
  <h1>UBCC / Legenda</h1>
  <p>B2B Account Engine · authorized team only</p>
  <div id="loginStep1">
    <input id="lemail" type="email" placeholder="Email" autocomplete="username">
    <input id="lpass" type="password" placeholder="Password" autocomplete="current-password">
    <label style="font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;margin-bottom:10px"><input type="checkbox" id="lremember" style="width:auto;margin:0" onchange="localStorage.setItem('b2b_remember',this.checked?'1':'0');location.reload()"> Remember this device (uncheck on shared computers)</label>
    <button id="lbtn" onclick="doLogin()">Enter</button>
  </div>
  <div id="loginStep2" class="hidden">
    <p style="margin-bottom:8px;font-size:13px">Enter the 6-digit code from your authenticator app:</p>
    <input id="lcode" inputmode="numeric" maxlength="6" placeholder="123456">
    <button onclick="verifyMfaLogin()">Verify</button>
  </div>
  <div id="loginerr"></div>
</div>

<div id="app" class="hidden">
<header>
  <span class="brand">UBCC · Legenda</span>
  <nav id="mainnav">
    <button data-v="board" class="on" onclick="go('board')">Board</button>
    <button data-v="today" onclick="go('today')">Today</button>
    <button data-v="titles" onclick="go('titles')">Titles</button>
    <button data-v="analytics" onclick="go('analytics')">Analytics</button>
    <button data-v="reports" onclick="go('reports')">Radar</button>
    <button data-v="health" onclick="go('health')">Health</button>
    <button data-v="declined" onclick="go('declined')">Declined</button>
  </nav>
  <div id="hright">
    <div id="goal" title="Touches this week vs target 10" onclick="go('today')"></div>
    <button class="hbtn" onclick="openPalette()" title="Ctrl+K">⌘K</button>
    <button class="hbtn" id="themeBtn" onclick="toggleTheme()">◐</button>
    <span id="who"></span>
    <button class="hbtn" id="secBtn" onclick="openSecurity()">2FA</button>
    <button class="hbtn" onclick="sb.auth.signOut().then(()=>location.reload())">Out</button>
  </div>
</header>
<div id="season"></div>
<main>
  <div id="v-board">
    <div class="kpis" id="boardKpis"></div>
    <div class="controls">
      <input id="q" placeholder="Search... ( / )" oninput="renderBoard()">
      <select id="fcat" onchange="renderBoard()"><option value="">All categories</option></select>
      <select id="fscore" onchange="renderBoard()"><option value="">Any score</option><option value="8">8+</option><option value="6">6+</option></select>
      <button class="btn salesonly" onclick="openNew()">+ Account</button>
      <button class="btn" onclick="exportCSV()">CSV</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div id="v-today" class="hidden"></div>
  <div id="v-titles" class="hidden"></div>
  <div id="v-analytics" class="hidden">
    <div class="kpis" id="anaKpis"></div>
    <div class="chartrow">
      <div class="chartbox"><h3>Pipeline funnel</h3><canvas id="cFunnel"></canvas></div>
      <div class="chartbox"><h3>Win rate by category</h3><canvas id="cWin"></canvas></div>
      <div class="chartbox"><h3>Touches per week</h3><canvas id="cAct"></canvas></div>
      <div class="chartbox"><h3>Accounts by category</h3><canvas id="cCat"></canvas></div>
    </div>
    <div class="sect"><h3>Monthly KPI targets</h3><div id="kpiTargets"></div></div>
  </div>
  <div id="v-reports" class="hidden"></div>
  <div id="v-health" class="hidden"></div>
  <div id="v-declined" class="hidden"></div>
</main>
<div id="bottomnav">

<script>
/* ============ CONFIG + STATE ============ */
const SUPABASE_URL = "https://qxjlgfqvqhtrbttcgysw.supabase.co";
const SUPABASE_KEY = "sb_publishable_FOeLR9B2zA6pRow0dcDqCw_2bHgiVar";
const STATUSES = ["To Contact","Contacted","Meeting","Proposal","Pilot","Won","Dead"];
const STAGE_PROB = {"To Contact":.05,"Contacted":.15,"Meeting":.35,"Proposal":.55,"Pilot":.75,"Won":1,"Dead":0,"Declined":0};
const ROT_DAYS = {"To Contact":14,"Contacted":5,"Meeting":7,"Proposal":10,"Pilot":14};
const DECLINE_REASONS = ["Not a fit for B2B strategy","Contacted before, bad experience","No realistic budget","Wrong segment for books","Asked not to be contacted","Closed / out of business","Other"];
let sb=null, ACC=[], TOUCH=[], LISTS=[], OPENS=[], RQ=[], SETTINGS={}, charts={}, ROLE='sales', CUR=null, VIEW='board';
const FN_URL = SUPABASE_URL + '/functions/v1/t?t=';
const RECUR_DAYS = {weekly:7, monthly:30, quarterly:90};
let ENROLL=null, IDLE_T=null, FAILS=0, DRAG=null, lastSync=0, rtT=null;
const REMEMBER = localStorage.getItem('b2b_remember')==='1';
const shareCode = new URLSearchParams(location.search).get('share');

const active   = () => ACC.filter(a=>a.status!=='Declined');
const declined = () => ACC.filter(a=>a.status==='Declined');
const canEdit  = () => ROLE==='sales';
const by = () => localStorage.getItem('b2b_user')||'Team';
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const today = () => new Date().toISOString().slice(0,10);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2200);}
function kpi(l,v){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;}

/* ============ THEME ============ */
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('b2b_theme',t);
  document.getElementById('themeBtn').textContent=t==='dark'?'☀':'◐';}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');}
(function(){const t=localStorage.getItem('b2b_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;})();

/* ============ CACHE (stale-while-revalidate) ============ */
function saveCache(){try{localStorage.setItem('b2b_cache_v5',JSON.stringify({t:Date.now(),ACC,TOUCH,LISTS,SETTINGS}));}catch(e){}}
function loadCacheInto(){try{const c=JSON.parse(localStorage.getItem('b2b_cache_v5')||'null');
  if(c&&c.ACC){ACC=c.ACC;TOUCH=c.TOUCH||[];LISTS=c.LISTS||[];SETTINGS=c.SETTINGS||{};return true;}}catch(e){} return false;}

/* ============ BOOT ============ */
function initClient(){ sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY,
  {auth:{storage: REMEMBER?window.localStorage:window.sessionStorage, persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}}); }
function whoFromEmail(e){return e.startsWith('shereen')?'Shereen':'Ahmad';}
async function mfaGateNeeded(){try{const {data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  return !!data&&data.nextLevel==='aal2'&&data.currentLevel!=='aal2';}catch(e){return false;}}
async function boot(){
  if(shareCode){return renderSharedCatalog(shareCode);}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){document.getElementById('login').classList.remove('hidden');return;}
  if(await mfaGateNeeded()){showMfaStep();return;}
  const email=session.user.email||'';
  if(!['ahmad@legenda-b2b.app','shereen@legenda-b2b.app'].includes(email)){
    await sb.auth.signOut();
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginerr').textContent='"'+email+'" has no access to the B2B app. Use your ahmad@legenda-b2b.app account.';
    return;}
  ROLE=email.startsWith('shereen')?'curator':'sales';
  localStorage.setItem('b2b_user',whoFromEmail(email));
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  if(ROLE==='curator'){document.querySelectorAll('.salesonly').forEach(e=>e.classList.add('hidden'));}
  document.getElementById('who').textContent=whoFromEmail(email)+(ROLE==='curator'?' · curation':'');
  const cached=loadCacheInto();
  if(cached){fillCatFilter();seasonBanner();goalRing();(ROLE==='curator')?go('titles'):renderBoard();}
  else if(ROLE!=='curator'){document.getElementById('board').innerHTML='<div class="col"><div class="skel"></div><div class="skel"></div></div><div class="col"><div class="skel"></div></div><div class="col"><div class="skel"></div><div class="skel"></div></div>';}
  await loadAll();
  seasonBanner();goalRing();startIdleWatch();renderSecurityBadge();subscribeRealtime();watchVisibility();
  if(ROLE==='curator'){go('titles');}else{go(VIEW);}
}
async function loadAll(){
  const [a,t,s,l,o,r]=await Promise.all([
    sb.from('b2b_accounts').select('*').order('score',{ascending:false,nullsFirst:false}),
    sb.from('b2b_touches').select('*').order('at',{ascending:false}).limit(800),
    sb.from('b2b_settings').select('*'),
    sb.from('b2b_lists').select('*').order('created_at',{ascending:false}),
    sb.from('b2b_opens').select('*').order('created_at',{ascending:false}).limit(300),
    sb.from('b2b_research_queue').select('*').order('requested_at',{ascending:false}).limit(100)]);
  if(a.data)ACC=a.data; if(t.data)TOUCH=t.data; if(l.data)LISTS=l.data;
  if(o.data)OPENS=o.data; if(r.data)RQ=r.data;
  if(s.data)SETTINGS=Object.fromEntries(s.data.map(r=>[r.key,r.value]));
  lastSync=Date.now(); fillCatFilter(); saveCache(); }
function fillCatFilter(){const cats=[...new Set(active().map(x=>x.category).filter(Boolean))].sort();
  fcat.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');}

/* ============ REALTIME (2-user live sync) ============ */
function subscribeRealtime(){
  try{
    sb.channel('db-live').on('postgres_changes',{event:'*',schema:'public'},p=>{
      const map={b2b_accounts:'ACC',b2b_touches:'TOUCH',b2b_lists:'LISTS',b2b_opens:'OPENS',b2b_research_queue:'RQ'};
      const key=map[p.table]; if(!key&&p.table!=='b2b_reports')return;
      if(key){
        const arr={ACC,TOUCH,LISTS,OPENS,RQ}[key];
        if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(id!=null){const i=arr.findIndex(x=>x.id===id);if(i>-1)arr.splice(i,1);}}
        else{const row=p.new;const i=arr.findIndex(x=>x.id===row.id);if(i>-1)arr[i]=row;else arr.unshift(row);}
        if(p.table==='b2b_opens'&&p.eventType==='UPDATE'&&p.new&&p.new.open_count>0){
          const acc=ACC.find(x=>x.id===p.new.account_id);
          toast('🔥 '+(acc?acc.name:'A prospect')+' opened your email');
        }
        if(p.table==='b2b_research_queue'&&p.eventType==='UPDATE'&&p.new&&p.new.status==='done'){
          const acc=ACC.find(x=>x.id===p.new.account_id);
          toast('🔎 Radar research done: '+(acc?acc.name:''));
        }
      }
      clearTimeout(rtT); rtT=setTimeout(()=>{saveCache();goalRing();
        if(!document.getElementById('dossier').classList.contains('hidden'))return;
        rerender();},200);
    }).subscribe();
  }catch(e){}
}
function rerender(){({board:renderBoard,today:renderToday,titles:renderTitles,analytics:renderAnalytics,health:renderHealth,declined:renderDeclined}[VIEW]||renderBoard)();}
function watchVisibility(){document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastSync>4*60*1000){await loadAll();rerender();}});}

/* ============ LOGIN + MFA ============ */
async function doLogin(){
  const btn=document.getElementById('lbtn'); if(btn.disabled)return;
  const {error}=await sb.auth.signInWithPassword({email:lemail.value.trim().toLowerCase(),password:lpass.value});
  if(error){FAILS++;const wait=Math.min(60,5*Math.pow(2,FAILS-1));
    document.getElementById('loginerr').textContent=`Login failed. Try again in ${wait}s.`;
    btn.disabled=true;setTimeout(()=>{btn.disabled=false;document.getElementById('loginerr').textContent='';},wait*1000);return;}
  FAILS=0;document.getElementById('loginerr').textContent='';
  if(await mfaGateNeeded()){showMfaStep();return;}
  boot();}
function showMfaStep(){document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginStep1').classList.add('hidden');
  document.getElementById('loginStep2').classList.remove('hidden');
  document.getElementById('lcode').focus();}
async function verifyMfaLogin(){
  const code=document.getElementById('lcode').value.trim();
  const {data:fs}=await sb.auth.mfa.listFactors();
  const f=(fs&&fs.totp&&fs.totp[0])||null;
  if(!f){document.getElementById('loginerr').textContent='No 2FA factor found.';return;}
  const ch=await sb.auth.mfa.challenge({factorId:f.id});
  if(ch.error){document.getElementById('loginerr').textContent=ch.error.message;return;}
  const vr=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code});
  if(vr.error){document.getElementById('loginerr').textContent='Wrong code, try again.';return;}
  document.getElementById('loginStep2').classList.add('hidden');
  document.getElementById('loginStep1').classList.remove('hidden');
  document.getElementById('loginerr').textContent='';boot();}

/* ============ SECURITY (2FA manage + idle) ============ */
async function renderSecurityBadge(){try{const {data:fs}=await sb.auth.mfa.listFactors();
  const on=!!(fs&&fs.totp&&fs.totp.length);
  document.getElementById('secBtn').textContent=on?'2FA ✓':'2FA';}catch(e){}}
async function openSecurity(){
  const m=document.getElementById('modal');
  const {data:fs}=await sb.auth.mfa.listFactors();
  const f=(fs&&fs.totp&&fs.totp[0])||null;
  m.classList.remove('hidden');
  if(f){m.innerHTML=`<div class="box"><h3>Two-factor authentication</h3>
    <p style="font-size:13px;margin:8px 0;line-height:1.6">2FA is ON. Every login asks for your authenticator code, and the database refuses any session that skipped it.</p>
    <div class="copyrow"><button class="btn danger" onclick="disableMfa('${f.id}')">Turn off 2FA</button>
    <button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Close</button></div></div>`;return;}
  const {data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'UBCC B2B'});
  if(error){toast(error.message);m.classList.add('hidden');return;}
  ENROLL=data;
  m.innerHTML=`<div class="box"><h3>Enable two-factor authentication</h3>
   <p style="font-size:12px;color:var(--ink2);margin:6px 0">Scan with Google Authenticator or Authy, then enter the 6-digit code.</p>
   <div style="background:#fff;padding:8px;text-align:center;border-radius:8px">${ENROLL.totp.qr_code}</div>
   <p style="font-size:10px;color:var(--ink2);word-break:break-all;margin:6px 0">Manual key: ${ENROLL.totp.secret}</p>
   <input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="123456" style="width:100%;padding:9px;border:1px solid var(--line2);border-radius:6px">
   <div class="copyrow"><button class="btn primary" onclick="confirmEnroll()">Activate 2FA</button>
   <button class="btn" onclick="cancelEnroll()">Cancel</button></div></div>`;}
async function confirmEnroll(){
  const code=document.getElementById('mfaCode').value.trim();
  const ch=await sb.auth.mfa.challenge({factorId:ENROLL.id});
  if(ch.error){toast(ch.error.message);return;}
  const vr=await sb.auth.mfa.verify({factorId:ENROLL.id,challengeId:ch.data.id,code});
  if(vr.error){toast('Wrong code, try again');return;}
  document.getElementById('modal').classList.add('hidden');toast('2FA is ON');renderSecurityBadge();}
async function cancelEnroll(){try{await sb.auth.mfa.unenroll({factorId:ENROLL.id});}catch(e){}
  document.getElementById('modal').classList.add('hidden');}
async function disableMfa(id){if(!confirm('Turn off two-factor authentication?'))return;
  const {error}=await sb.auth.mfa.unenroll({factorId:id});
  if(error){toast(error.message);return;}
  toast('2FA turned off');document.getElementById('modal').classList.add('hidden');renderSecurityBadge();}
function startIdleWatch(){const reset=()=>{clearTimeout(IDLE_T);IDLE_T=setTimeout(()=>{sb.auth.signOut().then(()=>location.reload());},30*60*1000);};
  ['click','keydown','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,reset,{passive:true}));reset();}

/* ============ SEASON + GOAL ============ */
function seasonInfo(){
  const now=new Date(),m=now.getMonth()+1,out=[];
  const dA=Math.ceil((new Date('2026-09-24')-now)/864e5);
  if(dA>0&&dA<120)out.push({txt:`Amman Book Fair in ${dA} days`,re:/mall|museum|culture|library|institution/i,boost:1});
  if(m>=10||m<=1)out.push({txt:'GIFTING WINDOW: corporate Ramadan + year-end decisions happen now',re:/csr|gift|corporate|bank|insurance|telecom|hr/i,boost:2});
  const dR=Math.ceil((new Date('2027-02-08')-now)/864e5);
  if(dR>0&&dR<190)out.push({txt:`Ramadan 2027 in ${dR} days`,re:/csr|gift|corporate/i,boost:1});
  if(m>=5&&m<=8)out.push({txt:'Summer: hotel kids clubs at peak',re:/hotel|tourism|resort|eco/i,boost:1.5});
  return out;}
function seasonBanner(){const s=seasonInfo();
  document.getElementById('season').textContent=s.map(x=>x.txt).join('  ·  ')||'No seasonal window active';}
function seasonBoost(a){let b=0,why=[];seasonInfo().forEach(s=>{if(s.re.test(a.category||'')){b+=s.boost;why.push(s.txt.split(':')[0]);}});return {b,why};}
function goalRing(){
  const wk=TOUCH.filter(t=>(Date.now()-new Date(t.at))<7*864e5&&t.kind!=='status').length;
  const pct=Math.min(1,wk/10),r=9,c=2*Math.PI*r;
  document.getElementById('goal').innerHTML=
   `<svg width="26" height="26"><circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--line2)" stroke-width="3"/>
    <circle cx="13" cy="13" r="${r}" fill="none" stroke="${pct>=1?'var(--ok)':'var(--teal2)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg>
    <span class="lbl">${wk}/10</span>`;}

/* ============ NAV ============ */
function go(v){VIEW=v;
  document.querySelectorAll('nav button,#bottomnav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['board','today','titles','analytics','reports','health','declined'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==v));
  ({board:renderBoard,today:renderToday,titles:renderTitles,analytics:renderAnalytics,reports:renderReports,health:renderHealth,declined:renderDeclined}[v])();}
function openMore(){
  const m=document.getElementById('modal');m.classList.remove('hidden');
  m.innerHTML=`<div class="box"><h3>More</h3><div style="display:grid;gap:8px">
   ${[['analytics','Analytics'],['reports','Radar reports'],['health','Data health'],['declined','Declined']].map(([v,l])=>`<button class="btn" onclick="document.getElementById('modal').classList.add('hidden');go('${v}')">${l}</button>`).join('')}
   <button class="btn" onclick="toggleTheme()">Toggle dark mode</button>
   <button class="btn" onclick="document.getElementById('modal').classList.add('hidden');openSecurity()">2FA settings</button>
   <button class="btn danger" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button>
   <button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Close</button></div></div>`;}

/* ============ BOARD ============ */
function filtered(){const q=(document.getElementById('q').value||'').toLowerCase(),c=fcat.value,ms=fscore.value;
  return active().filter(a=>(!c||a.category===c)&&(!ms||(a.score||0)>=+ms)&&(!q||(a.name+' '+(a.hook||'')+' '+(a.notes||'')).toLowerCase().includes(q)));}
function lastAct(a){const t=TOUCH.find(x=>x.account_id===a.id);
  return Math.max(t?+new Date(t.at):0, a.updated_at?+new Date(a.updated_at):0);}
function rotDays(a){const th=ROT_DAYS[a.status];if(!th)return 0;
  const d=(Date.now()-lastAct(a))/864e5;return d>th?Math.floor(d):0;}
function actionDot(a){
  if(['Won','Dead','Declined'].includes(a.status))return '';
  if(!a.next_action_date)return '<span class="dot a" title="nothing scheduled"></span>';
  return a.next_action_date<today()?'<span class="dot r" title="overdue"></span>':'<span class="dot g" title="scheduled"></span>';}
function cardHTML(a){
  const rd=rotDays(a);
  return `<div class="card ${rd?'rot':''}" draggable="${canEdit()}" data-id="${a.id}"
    ondragstart="dragStart(event,${a.id})" ondragend="dragEnd(event)" onclick="if(!DRAG)openDossier(${a.id})">
    <span class="score ${a.score>=8?'hi':''}">${a.score??'?'}</span>
    <div class="t">${actionDot(a)}${esc(a.name)}</div>
    <div class="m">${esc(a.decision_maker||a.area||'')}</div>
    ${rd?`<div class="rotlbl">${rd}d silent</div>`:''}
    <span class="badge">${esc(a.category||'')}</span>${a.verified===false?'<span class="badge red">unverified</span>':''}
    ${LISTS.some(l=>l.account_id===a.id)?'<span class="badge gold">titles ready</span>':''}
  </div>`;}
function renderBoard(){
  const f=filtered(),b=document.getElementById('board');b.innerHTML='';
  STATUSES.forEach(s=>{
    const items=f.filter(a=>a.status===s).sort((x,y)=>(x.next_action_date||'9999')<(y.next_action_date||'9999')?-1:((x.next_action_date||'9999')>(y.next_action_date||'9999')?1:(y.score||0)-(x.score||0)));
    const col=document.createElement('div');col.className='col';col.dataset.status=s;
    col.ondragover=e=>{e.preventDefault();col.classList.add('dragover');};
    col.ondragleave=()=>col.classList.remove('dragover');
    col.ondrop=e=>{e.preventDefault();col.classList.remove('dragover');dropCard(s);};
    col.innerHTML=`<h2>${s}<span class="n">${items.length}</span></h2>`+
      (items.map(cardHTML).join('')||`<div class="empty" style="padding:18px 8px;font-size:12px">Empty</div>`);
    b.appendChild(col);});
  const inMotion=f.filter(a=>["Contacted","Meeting","Proposal","Pilot"].includes(a.status)).length;
  const wt=f.reduce((s,a)=>s+(+a.est_value_jod||0)*STAGE_PROB[a.status],0);
  const rotting=f.filter(a=>rotDays(a)>0).length;
  document.getElementById('boardKpis').innerHTML=kpi('Active',f.length)+kpi('In motion',inMotion)+kpi('Rotting',rotting)+kpi('Won',f.filter(a=>a.status==='Won').length)+kpi('Weighted JOD',Math.round(wt).toLocaleString())+kpi('Declined',declined().length);}
function dragStart(e,id){DRAG=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>{const el=document.querySelector(`.card[data-id="${id}"]`);if(el)el.classList.add('dragging');},0);}
function dragEnd(){document.querySelectorAll('.card.dragging').forEach(el=>el.classList.remove('dragging'));setTimeout(()=>DRAG=null,50);}
async function dropCard(status){
  const id=DRAG;DRAG=null;if(!id||!canEdit())return;
  const a=ACC.find(x=>x.id===id);if(!a||a.status===status)return;
  await changeStatus(a,status);}
async function changeStatus(a,status){
  const prev=a.status;a.status=status;rerender();  /* optimistic */
  const {error}=await sb.from('b2b_accounts').update({status,updated_by:by()}).eq('id',a.id);
  if(error){a.status=prev;rerender();toast('Failed: '+error.message);return;}
  sb.from('b2b_touches').insert({account_id:a.id,kind:'status',detail:'Moved to '+status,by_user:by()}).then(()=>{});
  saveCache();toast('→ '+status);
  if(!['Won','Dead','Declined'].includes(status))askNext(a);}
function askNext(a){
  if(!canEdit())return;
  const m=document.getElementById('modal');m.classList.remove('hidden');
  const d=new Date();const plus=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
  m.innerHTML=`<div class="box"><h3>Next step for ${esc(a.name)}?</h3>
   <p style="font-size:12px;color:var(--ink2);margin-bottom:10px">Accounts with a scheduled next step never rot. What and when?</p>
   <div class="field"><label>Next action</label><input id="nxA" placeholder="e.g. WhatsApp follow-up / send proposal / visit" value="${esc(a.next_action||'')}"></div>
   <div class="field" style="margin-top:8px"><label>Repeat</label><select id="nxR">
     ${['','weekly','monthly','quarterly'].map(r=>`<option value="${r}" ${a.recur===r?'selected':''}>${r||'no repeat'}</option>`).join('')}</select></div>
   <div class="copyrow">
     <button class="btn" onclick="saveNext(${a.id},'${plus(1)}')">Tomorrow</button>
     <button class="btn" onclick="saveNext(${a.id},'${plus(3)}')">+3 days</button>
     <button class="btn" onclick="saveNext(${a.id},'${plus(7)}')">+1 week</button>
     <button class="btn" onclick="saveNext(${a.id},'${plus(30)}')">+1 month</button></div>
   <div class="copyrow"><input id="nxD" type="date" style="padding:8px;border:1px solid var(--line2);border-radius:6px">
     <button class="btn primary" onclick="saveNext(${a.id},document.getElementById('nxD').value)">Set date</button>
     <button class="btn" onclick="document.getElementById('modal').classList.add('hidden')">Skip</button></div></div>`;}
async function saveNext(id,date){
  if(!date)return;
  const a=ACC.find(x=>x.id===id);const na=document.getElementById('nxA')?document.getElementById('nxA').value:a.next_action;
  const rc=document.getElementById('nxR')?document.getElementById('nxR').value:(a.recur||'');
  const prev={d:a.next_action_date,n:a.next_action,r:a.recur};a.next_action_date=date;a.next_action=na;a.recur=rc;
  document.getElementById('modal').classList.add('hidden');rerender();
  const {error}=await sb.from('b2b_accounts').update({next_action:na,next_action_date:date,recur:rc,updated_by:by()}).eq('id',id);
  if(error){a.next_action_date=prev.d;a.next_action=prev.n;a.recur=prev.r;rerender();toast('Failed: '+error.message);return;}
  saveCache();toast('Scheduled '+date+(rc?' · repeats '+rc:''));}
async function doneAction(id){

function mapHeader(h){for(const [re,k] of HDR_MAP)if(re.test(String(h).trim()))return k;return null;}
async function uploadList(){
  const f=document.getElementById('upFile').files[0];
  const name=document.getElementById('upName').value.trim();
  const msg=document.getElementById('upMsg');
  if(!f||!name){msg.textContent='Choose a file and give the list a name.';return;}
  msg.textContent='Loading engine...';
  try{
    await ensureXLSX();
    msg.textContent='Reading file...';
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    if(!raw.length){msg.textContent='File looks empty.';return;}
    const headers=raw[0].map(String),keys=headers.map(mapHeader);
    const parsed=raw.slice(1).filter(r=>r.some(c=>String(c).trim())).slice(0,600).map(r=>{
      const o={extra:{}};
      r.forEach((c,i)=>{const k=keys[i],v=String(c).trim();if(k&&!o[k])o[k]=v;else if(headers[i])o.extra[headers[i]]=v;});
      if(!o.title)o.title=String(r.find(c=>String(c).trim())||'').trim();
      return o;});
    msg.textContent='Uploading file...';
    const path=`lists/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,'_')}`;
    const up=await sb.storage.from('b2b-files').upload(path,f);
    if(up.error){msg.textContent='Storage error: '+up.error.message;return;}
    const ins=await sb.from('b2b_lists').insert({account_id:document.getElementById('upAcc').value||null,
      name,note:document.getElementById('upNote').value.trim(),file_path:path,file_name:f.name,parsed,uploaded_by:by()}).select();
    if(ins.error){msg.textContent='DB error: '+ins.error.message;return;}
    msg.textContent='';toast(`Uploaded: ${name} (${parsed.length} titles)`);
    await loadAll();renderTitles();
  }catch(e){msg.textContent='Could not read this file: '+e.message;}}

function bookCard(t,i){

  return `<div class="book"><div class="cov" data-title="${esc(t.title)}" data-author="${esc(t.author||'')}" data-i="${i}">

async function fillMissingCovers(container,list){
  const covs=[...container.querySelectorAll('.cov')];let budget=30,found=false;
  for(const c of covs){
    if(c.querySelector('img'))continue;if(budget--<=0)break;
    const idx=+c.dataset.i;
    const q=encodeURIComponent(`intitle:${c.dataset.title} ${c.dataset.author?('inauthor:'+c.dataset.author):''}`);
    try{const r=await fetch(`https://www.googleapis.com/books/v1/volumes?q=${q}&maxResults=1`);
      const th=(await r.json()).items?.[0]?.volumeInfo?.imageLinks?.thumbnail;
      if(th){const url=th.replace('http://','https://');
        const img=document.createElement('img');img.src=url;img.loading='lazy';img.decoding='async';
        c.innerHTML='';c.appendChild(img);
        if(list&&list.parsed&&list.parsed[idx]){list.parsed[idx].cover=url;found=true;}}
    }catch(e){}}
  if(found&&list&&!shareCode){try{await sb.from('b2b_lists').update({parsed:list.parsed}).eq('id',list.id);}catch(e){}}}

function timeAgo(iso){const s=(Date.now()-new Date(iso))/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';}
function openChip(accId){
  const rows=OPENS.filter(o=>o.account_id===accId);
  if(!rows.length)return '';
  const opened=rows.filter(o=>o.open_count>0).sort((a,b)=>new Date(b.last_open_at)-new Date(a.last_open_at));
  if(opened.length)return `<span class="pill green">✓ Email opened ${opened.reduce((s,o)=>s+o.open_count,0)}x · last ${timeAgo(opened[0].last_open_at)}</span>`;
  return `<span class="pill">Pixel sent ${timeAgo(rows[0].created_at)}, not opened yet</span>`;}
async function createPixel(){
  if(!CUR||!canEdit())return;

  const {data,error}=await sb.from('b2b_opens').insert({account_id:CUR.id,label,created_by:by()}).select();
  if(error){toast('Error: '+error.message);return;}
  const url=FN_URL+data[0].token;
  await navigator.clipboard.writeText(url);
  document.getElementById('genOut').innerHTML+=`<div class="gen"><b>Tracking pixel created and URL copied.</b>\nIn Gmail: Insert photo (image icon) > Web Address (URL) > paste > Insert, then drag it tiny at the email's end.\nIn Outlook: Insert > Pictures > From web.\n\nYou will get a live alert here the moment ${esc(CUR.name)} opens the email, and the dossier will show "Email opened".\n\n${esc(url)}</div>`;
  toast('Pixel URL copied');}
function latestRQ(accId){return RQ.find(r=>r.account_id===accId)||null;}
function qChip(accId){const r=latestRQ(accId);if(!r)return '';
  if(r.status==='queued')return '<span class="pill amber">queued for radar</span>';
  if(r.status==='done')return '<span class="pill green">radar research done</span>';
  return '';}
function qResult(accId){const r=latestRQ(accId);
  if(r&&r.status==='done'&&r.result)return `<div class="gen" style="margin-top:8px"><b>Radar findings (${r.done_at?new Date(r.done_at).toLocaleDateString():''}):</b>\n${esc(r.result).slice(0,900)}</div>`;

function buildResearchPrompt(a){
  return `Research this Jordanian B2B prospect for UBCC/Legenda Bookstore (Amman book distributor, 20,000+ AR/EN titles, consignment and wholesale). Search the web, Jordan sources and Arabic sources too. NO INVENTION: only verified facts with sources, write "unknown" otherwise.

Prospect: ${a.name} | Category: ${a.category||'?'} | Area: ${a.area||'Amman'} | Current hook: ${a.hook||'none'}

Find: decision maker name+role for partnerships/procurement, best contact channel (public email/phone/Instagram), whether our hook is still valid, the strongest angle to sell books there (consignment corner, gifting, library, events), and budget/seasonal timing.

Then reply with ONLY this JSON (no other text):
{"decision_maker":"","contact_person":"","phone":"","email":"","instagram":"","hook":"","deal_model":"","score":0,"notes":"key facts + source URLs"}`;}
function openClaudeResearch(){
  if(!CUR)return;
  window.open('https://claude.ai/new?q='+encodeURIComponent(buildResearchPrompt(CUR)),'_blank');
  toast('Claude opened with the research brief. Paste its JSON back here.');}
async function applyResearch(){
  if(!CUR||!canEdit())return;
  let raw=document.getElementById('aiPaste').value.trim();
  raw=raw.replace(/^```(json)?/i,'').replace(/```$/,'').trim();
  let j;try{j=JSON.parse(raw);}catch(e){toast('Could not parse: paste the JSON exactly as Claude returned it');return;}
  const allow=['decision_maker','contact_person','phone','email','instagram','hook','deal_model','notes'];
  const u={updated_by:by()};let n=0;
  allow.forEach(k=>{const v=(j[k]??'').toString().trim();
    if(v&&v.toLowerCase()!=='unknown'){u[k]=(k==='notes'&&CUR.notes)?(CUR.notes+' | AI: '+v).slice(0,1500):v;n++;}});
  const sc=parseInt(j.score);if(sc>=1&&sc<=10){u.score=sc;n++;}
  if(!n){toast('Nothing usable in that JSON');return;}
  Object.assign(CUR,u);
  const {error}=await sb.from('b2b_accounts').update(u).eq('id',CUR.id);
  if(error){toast('Error: '+error.message);return;}
  sb.from('b2b_touches').insert({account_id:CUR.id,kind:'research',detail:'Applied Claude research ('+n+' fields)',by_user:by()}).then(()=>{});
  saveCache();toast(n+' fields updated');openDossier(CUR.id);}
async function queueResearch(){

const SEG_VALUE=[
 [/coffee|cafe|study/i,{pain:"guests finish their drink and leave",gain:"a curated shelf keeps guests seated longer and gives your space an identity people photograph and share"}],
 [/kids|baby|toy|pharma/i,{pain:"parents want meaningful add-ons at checkout",gain:"board books and bedtime stories sell beside your products with zero inventory risk"}],

 [/coworking|hub|incubator/i,{pain:"members expect more than desks",gain:"a rotating business and startup shelf becomes a perk that costs you nothing upfront"}],

 [/ngo|un-|foundation|institution|library|cultural|museum|edu/i,{pain:"program budgets need reliable local fulfillment",gain:"20,000+ titles in Amman stock, JOD invoicing and 5-branch delivery remove import risk from your program"}],

function greetAr(a){const p=(a.contact_person||'').trim();return p?('أستاذ/ة '+p.split(' ')[0]):'حضرتكم';}
function buildEmail(a,goal){

   follow:{subj:`متابعة: الكتب في ${a.name}`,body:`السلام عليكم ${greetAr(a)}،\n\nبتابع رسالتي السابقة بخصوص ركن الكتب في ${a.name}، وبعرف إنه الجدول بكون مزحوم.\n\nباختصار: ما في أي تكلفة مقدمة، نحن منجهز كل شي وبتدفعوا بس على المبيع.\n\nبيناسبكم 20 دقيقة على قهوة هالأسبوع؟ وإذا في شخص ثاني مسؤول عن هالموضوع، بقدّر التحويلة الصحيحة.\n\nمع الاحترام،\nأحمد الحافظ · UBCC / ليجيندا`},

   proposal:{subj:`الخطوة الجاية بخصوص العرض · ${a.name}`,body:`السلام عليكم ${greetAr(a)}،\n\nبتمنى العرض كان واضح. نقطتين بحب أأكد عليهم: ما في تكلفة مقدمة، ونحن منتولى التجهيز والتوصيل والتبديل بالكامل.\n\nوإذا في أي بند بدو تعديل، الدفع والتشكيلة مرنين؛ خبروني شو بيخلي القرار سهل.\n\nمنقفلها على قهوة هالأسبوع؟\n\nمع الاحترام،\nأحمد الحافظ · UBCC / ليجيندا`},
   revive:{subj:`نرجع نكمل حديثنا · ${a.name}`,body:`السلام عليكم ${greetAr(a)}،\n\nحكينا قبل فترة عن الكتب في ${a.name} وما كان التوقيت مناسب. اليوم الوضع اختلف: برنامج شراكاتنا كبر بعمّان، والموسم الجاي أقوى فرصة له.\n\nالعرض بعده قائم: بدون أي مبلغ مقدم، ونحن منقوم بكل الشغل. شو رأيكم بـ20 دقيقة جديدة؟\n\nمع الاحترام،\nأحمد الحافظ · UBCC / ليجيندا`}};

    <div class="copyrow"><button class="btn small primary" onclick="copyEl('genEN')">Copy English</button>${CUR.email?`<a class="btn small" href="mailto:${esc(CUR.email)}?subject=${encodeURIComponent(e.en.subj)}&body=${encodeURIComponent(e.en.body)}">Open in email app</a>`:''}</div>`;

function copyEl(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>toast('Copied'));}

/* ============ PALETTE (Ctrl+K) ============ */
let PSEL=0;
function paletteItems(qs){
  const actions=[
    {t:'Go to Board',k:'G B',f:()=>go('board')},{t:'Go to Today',k:'G T',f:()=>go('today')},
    {t:'Go to Titles',k:'',f:()=>go('titles')},{t:'Go to Analytics',k:'',f:()=>go('analytics')},
    {t:'Go to Radar reports',k:'',f:()=>go('reports')},{t:'Go to Declined',k:'',f:()=>go('declined')},
    {t:'Toggle dark mode',k:'',f:toggleTheme},{t:'Export CSV',k:'',f:exportCSV}];
  if(canEdit())actions.unshift({t:'New account',k:'N',f:openNew});
  const q=qs.toLowerCase();
  const accs=q?active().filter(a=>(a.name+' '+(a.category||'')).toLowerCase().includes(q)).slice(0,8)
    .map(a=>({t:a.name,k:a.status,f:()=>openDossier(a.id),acc:true})):[];
  return [...accs,...actions.filter(x=>!q||x.t.toLowerCase().includes(q))].slice(0,12);}
function openPalette(){
  const p=document.getElementById('palette');p.classList.remove('hidden');PSEL=0;
  p.innerHTML=`<div class="pbox"><input id="pq" placeholder="Search accounts or type a command..." autocomplete="off"><div id="plist"></div></div>`;
  const inp=document.getElementById('pq');
  const draw=()=>{const items=paletteItems(inp.value);
    document.getElementById('plist').innerHTML=items.map((x,i)=>`<div class="pitem ${i===PSEL?'sel':''}" onclick="palettePick(${i})">${x.acc?'◈ ':''}${esc(x.t)}<span class="k">${esc(x.k||'')}</span></div>`).join('');
    p.dataset.n=items.length;};
  inp.oninput=()=>{PSEL=0;draw();};
  inp.onkeydown=e=>{
    const items=paletteItems(inp.value);
    if(e.key==='ArrowDown'){PSEL=Math.min(items.length-1,PSEL+1);draw();e.preventDefault();}
    else if(e.key==='ArrowUp'){PSEL=Math.max(0,PSEL-1);draw();e.preventDefault();}
    else if(e.key==='Enter'){palettePick(PSEL);}
    else if(e.key==='Escape'){closePalette();}};
  p.onclick=e=>{if(e.target===p)closePalette();};
  draw();inp.focus();}
function palettePick(i){const items=paletteItems(document.getElementById('pq').value);
  closePalette();if(items[i])items[i].f();}
function closePalette(){document.getElementById('palette').classList.add('hidden');}

/* ============ CSV ============ */
function exportCSV(){
  const cols=['name','category','area','status','score','contact_person','phone','email','instagram','decision_maker','deal_model','hook','next_action','next_action_date','est_value_jod','declined_reason','notes'];
  const rows=[cols.join(',')].concat(ACC.map(a=>cols.map(c=>'"'+String(a[c]??'').replace(/"/g,'""')+'"').join(',')));
  const u=URL.createObjectURL(new Blob(["﻿"+rows.join("\n")],{type:'text/csv'}));
  const l=document.createElement('a');l.href=u;l.download='ubcc-b2b-pipeline.csv';l.click();}

/* ============ GLOBAL LISTENERS + INIT ============ */
document.addEventListener('DOMContentLoaded',()=>{
  initClient();
  document.getElementById('lpass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('lcode').addEventListener('keydown',e=>{if(e.key==='Enter')verifyMfaLogin();});
  document.getElementById('lremember').checked=REMEMBER;
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return;}
    if(e.target.matches('input,textarea,select'))return;
    if(e.key==='/'){e.preventDefault();go('board');document.getElementById('q').focus();}
    if(e.key==='Escape'){closePalette();document.getElementById('modal').classList.add('hidden');}});
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
  boot();});
</script>
