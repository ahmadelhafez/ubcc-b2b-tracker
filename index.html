<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBCC / Legenda · B2B Account Engine</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<style>
:root{--teal:#008EA6;--deep:#056A78;--paper:#F7F4EF;--char:#3A3A3A;--grey:#8a8578;--card:#fff;--rust:#B05C3B;--gold:#A8894C;--line:#e6e0d2;--ok:#2e7d32;--bad:#c62828;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--paper);color:var(--char);font-size:14px}
h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif}
button{cursor:pointer;font-family:inherit}
a{color:var(--deep)}
.hidden{display:none!important}
/* login */
#login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
#login h1{color:var(--deep);font-size:22px;margin-bottom:4px}
#login p{color:var(--grey);font-size:12px;margin-bottom:18px}
#login input{width:100%;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
#login button{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold}
#loginerr{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px}
/* shell */
header{background:var(--deep);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
header h1{font-size:18px;letter-spacing:.4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 14px;border-radius:20px;font-size:12px}
nav button.on{background:var(--teal);border-color:var(--teal);font-weight:bold}
#who{margin-left:auto;font-size:11px;opacity:.8}
#season{background:var(--gold);color:#fff;padding:6px 20px;font-size:12px;text-align:center}
main{padding:18px 20px;max-width:1500px;margin:0 auto}
/* controls */
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.controls input,.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px}
.controls input{min-width:200px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px}
.btn.primary{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:bold}
.btn.small{padding:4px 9px;font-size:11px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}
.kpi .l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:24px;font-weight:bold;color:var(--deep);font-family:Georgia,serif}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.col{min-width:255px;max-width:255px;background:#efeade;border-radius:12px;padding:8px;flex-shrink:0}
.col h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--deep);padding:6px;display:flex;justify-content:space-between;font-family:Arial}
.col .n{background:var(--teal);color:#fff;border-radius:10px;padding:0 8px;font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:7px 0;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer}
.card:hover{border-color:var(--teal)}
.card .t{font-size:13px;font-weight:bold}
.card .m{font-size:11px;color:var(--grey);margin-top:3px}
.badge{display:inline-block;font-size:10px;border-radius:7px;padding:1px 7px;margin-top:5px;background:#eef6f7;color:var(--deep);border:1px solid #cfe6ea;margin-right:3px}
.score{float:right;font-size:11px;font-weight:bold;color:#fff;background:var(--teal);border-radius:7px;padding:1px 7px}
.score.hi{background:var(--rust)}
.flag{font-size:10px;color:var(--rust);font-weight:bold}
/* dossier */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}
#dossier{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--paper);z-index:100;overflow-y:auto;box-shadow:-6px 0 30px rgba(0,0,0,.2);padding:22px}
#dossier h2{color:var(--deep);font-size:20px;margin-bottom:2px}
.sect{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:12px}
.sect h3{font-size:13px;color:var(--deep);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{font-size:10px;color:var(--grey);text-transform:uppercase;display:block;margin-bottom:2px}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff}
textarea{resize:vertical;font-family:inherit}
.statusrow{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.statusrow button{padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;font-size:11px}
.statusrow button.on{background:var(--deep);color:#fff;border-color:var(--deep);font-weight:bold}
.touch{border-left:3px solid var(--teal);padding:6px 10px;margin:6px 0;background:#fbfaf6;font-size:12px;border-radius:0 7px 7px 0}
.touch .d{color:var(--grey);font-size:10px}
.gen{white-space:pre-wrap;background:#fbfaf6;border:1px dashed var(--line);border-radius:8px;padding:12px;font-size:13px;margin-top:8px;line-height:1.6}
.gen[dir=rtl]{text-align:right;font-size:14px}
.copyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* charts */
.chartrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.chartbox h3{font-size:13px;color:var(--deep);margin-bottom:10px}
.chartbox canvas{max-height:260px}
/* lists */
.rowitem{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:6px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rowitem .grow{flex:1;min-width:200px}
.pill{font-size:10px;padding:2px 8px;border-radius:9px;background:#f3efe4;color:var(--grey)}
.pill.red{background:#fdecea;color:var(--bad);font-weight:bold}
.pill.amber{background:#fff6e0;color:#8a6d00;font-weight:bold}
.report{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.report h3{color:var(--deep)}
.report pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.6;margin-top:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 22px;border-radius:22px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s}
@media(max-width:700px){.grid2{grid-template-columns:1fr}#dossier{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <h1>UBCC / Legenda</h1>
  <p>B2B Account Engine · Ahmad + Fawaz</p>
  <input id="lemail" type="email" value="team@legenda-b2b.app" autocomplete="username">
  <input id="lpass" type="password" placeholder="Team password" autocomplete="current-password">
  <button onclick="doLogin()">Enter</button>
  <div id="loginerr"></div>
</div>

<div id="app" class="hidden">
<header>
  <h1>UBCC / Legenda · B2B</h1>
  <nav>
    <button data-v="board" class="on" onclick="go('board')">Board</button>
    <button data-v="today" onclick="go('today')">Today</button>
    <button data-v="analytics" onclick="go('analytics')">Analytics</button>
    <button data-v="reports" onclick="go('reports')">Radar Reports</button>
    <button data-v="health" onclick="go('health')">Data Health</button>
  </nav>
  <span id="who"></span>
  <button class="btn small" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="sb.auth.signOut().then(()=>location.reload())">Log out</button>
</header>
<div id="season"></div>
<main>
  <div id="v-board">
    <div class="kpis" id="boardKpis"></div>
    <div class="controls">
      <input id="q" placeholder="Search name, hook, notes..." oninput="renderBoard()">
      <select id="fcat" onchange="renderBoard()"><option value="">All categories</option></select>
      <select id="fscore" onchange="renderBoard()"><option value="">Any score</option><option value="8">8+</option><option value="6">6+</option></select>
      <button class="btn" onclick="openNew()">+ Add account</button>
      <button class="btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div id="v-today" class="hidden"></div>
  <div id="v-analytics" class="hidden">
    <div class="kpis" id="anaKpis"></div>
    <div class="chartrow">
      <div class="chartbox"><h3>Pipeline funnel</h3><canvas id="cFunnel"></canvas></div>
      <div class="chartbox"><h3>Win rate by category (closed deals)</h3><canvas id="cWin"></canvas></div>
      <div class="chartbox"><h3>Activity: touches per week (target 40 outreach/mo)</h3><canvas id="cAct"></canvas></div>
      <div class="chartbox"><h3>Accounts by category</h3><canvas id="cCat"></canvas></div>
    </div>
    <div class="sect"><h3>Monthly KPI targets (from your plan)</h3><div id="kpiTargets"></div></div>
  </div>
  <div id="v-reports" class="hidden"></div>
  <div id="v-health" class="hidden"></div>
</main>
</div>

<div id="overlay" class="hidden" onclick="closeDossier()"></div>
<div id="dossier" class="hidden"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL = "https://qxjlgfqvqhtrbttcgysw.supabase.co";
const SUPABASE_KEY = "sb_publishable_FOeLR9B2zA6pRow0dcDqCw_2bHgiVar";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES = ["To Contact","Contacted","Meeting","Proposal","Pilot","Won","Dead"];
const STAGE_PROB = {"To Contact":0.05,"Contacted":0.15,"Meeting":0.35,"Proposal":0.55,"Pilot":0.75,"Won":1,"Dead":0};
let ACC = [], TOUCH = [], SETTINGS = {}, charts = {};

/* ---------- boot ---------- */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ document.getElementById('login').classList.remove('hidden'); return; }
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent = localStorage.getItem('b2b_user') || setUserName();
  await loadAll(); seasonBanner(); renderBoard(); }
function setUserName(){
  let n = prompt("Who is using this device? (Ahmad / Fawaz)","Ahmad") || "Team";
  localStorage.setItem('b2b_user', n); return n; }
async function doLogin(){
  const {error} = await sb.auth.signInWithPassword({email:lemail.value.trim(), password:lpass.value});
  document.getElementById('loginerr').textContent = error ? error.message : "";
  if(!error) boot(); }
async function loadAll(){
  const [a,t,s] = await Promise.all([
    sb.from('b2b_accounts').select('*').order('score',{ascending:false,nullsFirst:false}),
    sb.from('b2b_touches').select('*').order('at',{ascending:false}),
    sb.from('b2b_settings').select('*')]);
  ACC = a.data||[]; TOUCH = t.data||[]; SETTINGS = Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
  const cats=[...new Set(ACC.map(x=>x.category).filter(Boolean))].sort();
  fcat.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join(''); }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function by(){return localStorage.getItem('b2b_user')||'Team';}

/* ---------- season banner ---------- */
function seasonBanner(){
  const now=new Date(), msg=[];
  const aibf=new Date('2026-09-24'); const dA=Math.ceil((aibf-now)/864e5);
  if(dA>0&&dA<120) msg.push(`Amman Book Fair in ${dA} days (24 Sep - 3 Oct)`);
  const m=now.getMonth()+1;
  if(m>=10||m<=1) msg.push("GIFTING WINDOW OPEN: corporate Ramadan/year-end decisions happen now");
  const ram=new Date('2027-02-08'); const dR=Math.ceil((ram-now)/864e5);
  if(dR>0&&dR<190) msg.push(`Ramadan 2027 in ${dR} days: close gifting deals before mid-January`);
  if(m>=5&&m<=8) msg.push("Summer: hotel kids clubs at peak, pitch reading programs now");
  document.getElementById('season').textContent = msg.join("  ·  ") || "No seasonal window active";
}

/* ---------- views ---------- */
function go(v){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  ['board','today','analytics','reports','health'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==v));
  if(v==='board')renderBoard(); if(v==='today')renderToday(); if(v==='analytics')renderAnalytics();
  if(v==='reports')renderReports(); if(v==='health')renderHealth(); }

function filtered(){
  const q=(document.getElementById('q').value||'').toLowerCase(), c=fcat.value, ms=fscore.value;
  return ACC.filter(a=>(!c||a.category===c)&&(!ms||(a.score||0)>=+ms)&&(!q||(a.name+' '+(a.hook||'')+' '+(a.notes||'')).toLowerCase().includes(q))); }

function lastTouch(id){const t=TOUCH.find(x=>x.account_id===id);return t?new Date(t.at):null;}
function isStale(a){ if(!["Contacted","Meeting","Proposal","Pilot"].includes(a.status)) return false;
  const t=lastTouch(a.id)||new Date(a.updated_at); return (Date.now()-t)/864e5>14; }

function renderBoard(){
  const f=filtered(), b=document.getElementById('board'); b.innerHTML='';
  STATUSES.forEach(s=>{
    const items=f.filter(a=>a.status===s);
    const col=document.createElement('div'); col.className='col';
    col.innerHTML=`<h2>${s}<span class="n">${items.length}</span></h2>`+items.map(a=>`
      <div class="card" onclick="openDossier(${a.id})">
        <span class="score ${a.score>=8?'hi':''}">${a.score??'?'}</span>
        <div class="t">${esc(a.name)}</div>
        <div class="m">${esc(a.decision_maker||a.area||'')}</div>
        ${isStale(a)?'<div class="flag">STALE 14+ days</div>':''}
        ${a.next_action_date&&new Date(a.next_action_date)<new Date()?'<div class="flag">OVERDUE action</div>':''}
        <span class="badge">${esc(a.category||'')}</span>${a.verified===false?'<span class="badge" style="color:var(--rust);border-color:var(--rust)">unverified</span>':''}
      </div>`).join('');
    b.appendChild(col); });
  const inMotion=f.filter(a=>["Contacted","Meeting","Proposal","Pilot"].includes(a.status)).length;
  const wt=f.reduce((s,a)=>s+(+a.est_value_jod||0)*STAGE_PROB[a.status],0);
  document.getElementById('boardKpis').innerHTML=kpi('Accounts',f.length)+kpi('In motion',inMotion)+kpi('Won',f.filter(a=>a.status==='Won').length)+kpi('Hot untouched (8+)',f.filter(a=>a.score>=8&&a.status==='To Contact').length)+kpi('Weighted pipeline',`JOD ${Math.round(wt).toLocaleString()}`); }
function kpi(l,v){return `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`;}

/* ---------- TODAY ---------- */
function renderToday(){
  const el=document.getElementById('v-today'); const today=new Date().toISOString().slice(0,10);
  const overdue=ACC.filter(a=>a.next_action_date&&a.next_action_date<today&&!['Won','Dead'].includes(a.status));
  const due=ACC.filter(a=>a.next_action_date===today);
  const stale=ACC.filter(isStale);
  const hot=ACC.filter(a=>a.score>=8&&a.status==='To Contact').slice(0,5);
  const row=(a,tag,cls)=>`<div class="rowitem"><span class="pill ${cls}">${tag}</span>
    <div class="grow"><b>${esc(a.name)}</b> <span style="color:var(--grey);font-size:12px">${esc(a.next_action||a.deal_model||'')}</span></div>
    <button class="btn small primary" onclick="openDossier(${a.id})">Open</button>
    <button class="btn small" onclick="openDossier(${a.id},'outreach')">Compose</button></div>`;
  el.innerHTML=`<h2 class="serif" style="color:var(--deep);margin-bottom:10px">Today's queue · ${new Date().toDateString()}</h2>
    ${overdue.length?`<h3 style="margin:10px 0 4px">Overdue (${overdue.length})</h3>`+overdue.map(a=>row(a,'OVERDUE','red')).join(''):''}
    ${due.length?`<h3 style="margin:10px 0 4px">Due today (${due.length})</h3>`+due.map(a=>row(a,'DUE','amber')).join(''):''}
    ${stale.length?`<h3 style="margin:10px 0 4px">Going cold, 14+ days silent (${stale.length})</h3>`+stale.map(a=>row(a,'STALE','amber')).join(''):''}
    <h3 style="margin:10px 0 4px">Highest-value untouched</h3>${hot.map(a=>row(a,'HOT','red')).join('')||'<p style="color:var(--grey)">None, pipeline is worked. Good.</p>'}
    <p style="color:var(--grey);font-size:12px;margin-top:14px">Jordan rhythm: calls 10am-2pm land best. No business contact Friday 12-2pm. WhatsApp after a first email is expected, not pushy.</p>`; }

/* ---------- ANALYTICS ---------- */
function renderAnalytics(){
  const cnt=Object.fromEntries(STATUSES.map(s=>[s,ACC.filter(a=>a.status===s).length]));
  const closedCats={}; ACC.forEach(a=>{if(['Won','Dead'].includes(a.status)){closedCats[a.category]=closedCats[a.category]||{w:0,d:0}; a.status==='Won'?closedCats[a.category].w++:closedCats[a.category].d++;}});
  const catCount={}; ACC.forEach(a=>{catCount[a.category||'Other']=(catCount[a.category||'Other']||0)+1;});
  const topCats=Object.entries(catCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const weeks=[...Array(8)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-7*(7-i));return d;});
  const wk=weeks.map(w=>{const w2=new Date(w);w2.setDate(w2.getDate()+7);return TOUCH.filter(t=>{const x=new Date(t.at);return x>=w&&x<w2;}).length;});
  const wt=ACC.reduce((s,a)=>s+(+a.est_value_jod||0)*STAGE_PROB[a.status],0);
  const resp=ACC.filter(a=>a.response&&a.response.trim()).length, sent=ACC.filter(a=>a.outreach_date&&String(a.outreach_date).trim()).length;
  document.getElementById('anaKpis').innerHTML=kpi('Weighted pipeline',`JOD ${Math.round(wt).toLocaleString()}`)+kpi('Outreach sent',sent)+kpi('Responses',resp)+kpi('Response rate',sent?Math.round(resp/sent*100)+'%':'0%')+kpi('Meetings+',cnt['Meeting']+cnt['Proposal']+cnt['Pilot']+cnt['Won'])+kpi('Won / Dead',`${cnt['Won']} / ${cnt['Dead']}`);
  const mk=(id,cfg)=>{charts[id]&&charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg);};
  mk('cFunnel',{type:'bar',data:{labels:STATUSES,datasets:[{data:STATUSES.map(s=>cnt[s]),backgroundColor:['#8a8578','#A8894C','#056A78','#008EA6','#B05C3B','#2e7d32','#c62828']}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  mk('cWin',{type:'bar',data:{labels:Object.keys(closedCats),datasets:[{label:'Won',data:Object.values(closedCats).map(x=>x.w),backgroundColor:'#2e7d32'},{label:'Dead',data:Object.values(closedCats).map(x=>x.d),backgroundColor:'#c62828'}]},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}}}});
  mk('cAct',{type:'line',data:{labels:weeks.map(w=>(w.getMonth()+1)+'/'+w.getDate()),datasets:[{label:'Touches',data:wk,borderColor:'#008EA6',backgroundColor:'#008EA620',fill:true,tension:.3},{label:'Weekly target (10)',data:wk.map(()=>10),borderColor:'#B05C3B',borderDash:[6,4],pointRadius:0}]},options:{scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  mk('cCat',{type:'doughnut',data:{labels:topCats.map(x=>x[0]),datasets:[{data:topCats.map(x=>x[1]),backgroundColor:['#008EA6','#056A78','#A8894C','#B05C3B','#8a8578','#6aa8b5','#c9b88a','#d99b7c']}]},options:{plugins:{legend:{position:'right'}},cutout:'58%'}});
  const T=SETTINGS.kpi_targets||{};
  document.getElementById('kpiTargets').innerHTML='<table style="width:100%;font-size:12px;border-collapse:collapse">'+Object.entries(T).map(([k,v])=>{
    let cur='';
    if(k==='Outreach messages sent')cur=sent; if(k==='Responses received')cur=resp;
    if(k==='Prospects researched & listed')cur=ACC.length; if(k==='Meetings scheduled')cur=cnt['Meeting']+cnt['Proposal']+cnt['Pilot']+cnt['Won'];
    if(k==='Pilots signed')cur=cnt['Pilot']+cnt['Won']; if(k==='Locations with books live')cur=cnt['Won'];
    const pct=cur!==''&&v?Math.min(100,Math.round(cur/v*100)):null;
    return `<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 4px">${esc(k)}</td><td style="text-align:right;font-weight:bold">${cur!==''?cur:'-'}</td><td style="text-align:right;color:var(--grey)">target ${v}</td><td style="width:30%;padding:6px"><div style="background:#eee;border-radius:6px;height:8px">${pct!==null?`<div style="width:${pct}%;background:${pct>=100?'var(--ok)':'var(--teal)'};height:8px;border-radius:6px"></div>`:''}</div></td></tr>`;}).join('')+'</table>'; }

/* ---------- REPORTS ---------- */
async function renderReports(){
  const el=document.getElementById('v-reports');
  const {data}=await sb.from('b2b_reports').select('*').order('run_date',{ascending:false}).limit(12);

/* ---------- DATA HEALTH (self-improvement surface) ---------- */
function renderHealth(){
  const el=document.getElementById('v-health');
  const unv=ACC.filter(a=>a.verified===false);
  const nodm=ACC.filter(a=>!a.decision_maker&&!['Won','Dead'].includes(a.status));
  const nocontact=ACC.filter(a=>!a.phone&&!a.email&&!a.instagram&&a.status!=='Dead');
  const deadlink=ACC.filter(a=>a.link_ok===false);
  const names={}; const dups=[]; ACC.forEach(a=>{const k=a.name.toLowerCase().replace(/[^a-z؀-ۿ]/g,'');(names[k]=names[k]||[]).push(a.name);});
  Object.values(names).filter(v=>v.length>1).forEach(v=>dups.push(v.join(' = ')));
  const dir=SETTINGS.radar_directives||{};
  const li=(a)=>`<div class="rowitem"><div class="grow"><b>${esc(a.name)}</b> <span class="pill">${esc(a.category||'')}</span></div><button class="btn small" onclick="openDossier(${a.id})">Fix</button></div>`;
  el.innerHTML=`<h2 class="serif" style="color:var(--deep)">Data health · the radar's self-check</h2>
  <p style="color:var(--grey);font-size:12px;margin:6px 0 12px">The Monday radar verifies links, flags unverified claims, and rebalances next week's research toward categories that actually convert. Its current focus: <b>${esc((dir.focus_next||[]).join(', '))}</b> (last run ${dir.last_run??0}).</p>
  <div class="sect"><h3>Unverified accounts (${unv.length}) · radar will verify, or verify manually before outreach</h3>${unv.map(li).join('')||'None'}</div>
  <div class="sect"><h3>Dead source links flagged by radar (${deadlink.length})</h3>${deadlink.map(li).join('')||'None'}</div>
  <div class="sect"><h3>No decision maker mapped (${nodm.length})</h3>${nodm.slice(0,15).map(li).join('')||'None'}</div>
  <div class="sect"><h3>No contact channel at all (${nocontact.length})</h3>${nocontact.slice(0,15).map(li).join('')||'None'}</div>
  <div class="sect"><h3>Possible duplicates (${dups.length})</h3>${dups.map(d=>`<div class="rowitem">${esc(d)}</div>`).join('')||'None'}</div>`; }

/* ---------- DOSSIER ---------- */

    <div class="field"><label>Instagram</label><input id="f_instagram" value="${esc(a.instagram)}"></div>
    <div class="field"><label>Next action</label><input id="f_next_action" value="${esc(a.next_action)}"></div>

function closeDossier(){document.getElementById('overlay').classList.add('hidden');document.getElementById('dossier').classList.add('hidden');CUR=null;}
async function setStatus(s){
  if(!CUR)return;
  await sb.from('b2b_accounts').update({status:s,updated_by:by()}).eq('id',CUR.id);
  await sb.from('b2b_touches').insert({account_id:CUR.id,kind:'status',detail:'Moved to '+s,by_user:by()});
  toast('Status: '+s); await loadAll(); openDossier(CUR?CUR.id:null); renderBoard(); }
async function saveFields(){
  const u={}; ['contact_person','phone','email','instagram','next_action','next_action_date','est_value_jod','decision_maker','notes'].forEach(k=>{const el=document.getElementById('f_'+k); if(el) u[k]=el.value||null;});
  if(u.est_value_jod==='')u.est_value_jod=null; if(u.next_action_date==='')u.next_action_date=null;
  u.updated_by=by();
  const {error}=await sb.from('b2b_accounts').update(u).eq('id',CUR.id);
  toast(error?('Error: '+error.message):'Saved'); await loadAll(); renderBoard(); }
async function logTouch(kind){
  const detail=document.getElementById('touchDetail').value||'';
  await sb.from('b2b_touches').insert({account_id:CUR.id,kind,detail,by_user:by()});
  if(['call','whatsapp','email'].includes(kind)&&!CUR.outreach_date)
    await sb.from('b2b_accounts').update({outreach_date:new Date().toISOString().slice(0,10),updated_by:by()}).eq('id',CUR.id);
  toast('Logged '+kind); await loadAll(); openDossier(CUR.id); }
async function openNew(){
  const name=prompt("Account name?"); if(!name)return;
  const {error}=await sb.from('b2b_accounts').insert({name,category:'Other',status:'To Contact',date_added:new Date().toISOString().slice(0,10),updated_by:by(),run:-1});
  if(error){toast(error.message);return;} await loadAll(); renderBoard(); }

/* ---------- EMAIL CREATOR (deterministic, uses only stored facts) ---------- */
const SEG_VALUE = [
 [/coffee|cafe|study/i, {pain:"guests finish their drink and leave", gain:"a curated shelf keeps guests seated longer and gives your space an identity people photograph and share"}],
 [/kids|baby|toy|pharma/i, {pain:"parents want meaningful add-ons at checkout", gain:"board books and bedtime stories sell beside your products with zero inventory risk"}],
 [/hotel|resort|lodge|lounge|tourism/i, {pain:"kids clubs and lobbies offer screens, not memories", gain:"a curated reading corner becomes a guest-experience upgrade reviewers mention"}],
 [/coworking|hub|incubator/i, {pain:"members expect more than desks", gain:"a rotating business and startup shelf becomes a perk that costs you nothing upfront"}],
 [/csr|bank|corporate|insurance|telecom/i, {pain:"CSR programs need visible, reportable education impact", gain:"branded book distributions deliver measurable impact numbers for your sustainability report"}],
 [/ngo|un-|foundation|institution|library|cultural|museum|edu/i, {pain:"program budgets need reliable local fulfillment", gain:"20,000+ titles in Amman stock, JOD invoicing and 5-branch delivery remove import risk from your program"}],
 [/mall|lifestyle|retail|stationery|boutique/i, {pain:"footfall needs fresh reasons to stop", gain:"a book corner or seasonal pop-up adds dwell time and a new margin line on consignment"}],
 [/language/i, {pain:"learners need readers and exam prep faster than UK shipping cycles", gain:"same-week local replenishment of graded readers and exam materials"}],
];
function segVal(cat){for(const [re,v] of SEG_VALUE) if(re.test(cat||'')) return v; return {pain:"finding reliable book supply in Jordan is harder than it should be", gain:"a curated selection from 20,000+ titles, delivered and rotated by us on flexible terms"};}
function greet(a){const p=(a.contact_person||'').trim();return p?p.split(' ')[0]:'there';}
function greetAr(a){const p=(a.contact_person||'').trim();return p?('أستاذ/ة '+p.split(' ')[0]):'حضرتكم';}

function genEmail(){

  const e=buildEmail(CUR,goal,lang); let html='';
  if(lang!=='ar') html+=`<div class="gen" id="genEN"><b>Subject:</b> ${esc(e.en.subj)}\n\n${esc(e.en.body)}</div>
    <div class="copyrow"><button class="btn small primary" onclick="copyEl('genEN')">Copy English</button>${CUR.email?`<a class="btn small" href="mailto:${esc(CUR.email)}?subject=${encodeURIComponent(e.en.subj)}&body=${encodeURIComponent(e.en.body)}">Open in email app</a>`:''}</div>`;
  if(lang!=='en') html+=`<div class="gen" dir="rtl" id="genAR"><b>الموضوع:</b> ${esc(e.ar.subj)}\n\n${esc(e.ar.body)}</div>
    <div class="copyrow"><button class="btn small primary" onclick="copyEl('genAR')">Copy Arabic</button></div>`;
  html+=`<p style="font-size:11px;color:var(--grey);margin-top:6px">Built only from stored account facts, nothing invented. Logging the send: use "Log a touch" below.</p>`;
  document.getElementById('genOut').innerHTML=html; }

function copyAIPrompt(){

function copyEl(id){const el=document.getElementById(id);navigator.clipboard.writeText(el.innerText.replace(/^Subject: /,'Subject: ')).then(()=>toast('Copied'));}

/* ---------- CSV export ---------- */
function exportCSV(){
  const cols=['name','category','area','status','score','contact_person','phone','email','instagram','decision_maker','deal_model','hook','next_action','next_action_date','est_value_jod','notes'];
  const rows=[cols.join(',')].concat(ACC.map(a=>cols.map(c=>'"'+String(a[c]??'').replace(/"/g,'""')+'"').join(',')));
  const b=new Blob(["﻿"+rows.join("\n")],{type:'text/csv'});
  const u=URL.createObjectURL(b); const l=document.createElement('a'); l.href=u; l.download='ubcc-b2b-pipeline.csv'; l.click(); }
